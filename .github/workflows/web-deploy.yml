# web/ CI + deploy — runs only when the web app or the contract changes.
# Test + build validation for the web portal. The actual deploy step (static
# host) is wired once the surface has real content.
name: web-deploy

on:
  push:
    # Branches only. A tag push points at a commit these jobs have ALREADY passed
    # on its branch and again on main, so re-running the full matrix for the tag
    # buys nothing and was costing ~9 minutes of the private-repo Actions budget
    # per release. Restricting to branches excludes tag refs; drop this line once
    # the repo is public and minutes are unmetered.
    branches:
      - "**"
    paths:
      - "web/**"
      - "api/**"
      - "contracts/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - "contracts/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck web
        run: pnpm --filter od-amrita-web typecheck
      - name: Lint web
        run: pnpm --filter od-amrita-web lint
      - name: Test web components
        run: pnpm --filter od-amrita-web test
      - name: Install Playwright Chromium
        run: pnpm --filter od-amrita-web exec playwright install --with-deps chromium
      - name: Test web journeys
        run: pnpm --filter od-amrita-web test:e2e
      - name: Build web
        run: pnpm --filter od-amrita-web build
      # - name: Deploy   # wired once the SPA has real content
      #   run: echo "deploy step lands with the first web release"

  portal-integration:
    name: browser + real API + postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: od_amrita
          POSTGRES_USER: od_amrita
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U od_amrita -d od_amrita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUPERUSER_DSN: postgres://od_amrita:ci_only_password@localhost:5432/od_amrita?sslmode=disable
      DATABASE_URL_MIGRATOR: postgres://od_migrator:migrator_dev_only_change_me@localhost:5432/od_amrita?sslmode=disable
      DATABASE_URL_RUNTIME: postgres://od_runtime:runtime_dev_only_change_me@localhost:5432/od_amrita?sslmode=disable
      CARD_SEAL_ACTIVE_VERSION: dev
      CARD_SEAL_HMAC_KEYS: dev=Y2ktZGV2LWNhcmQtc2VhbC1rZXktMzItYnl0ZXMhISEh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install database migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.2
      - name: Bootstrap and migrate database
        run: |
          psql "$SUPERUSER_DSN" -v ON_ERROR_STOP=1 -f api/db/init/00_roles.sql
          goose -dir api/db/migrations postgres "$DATABASE_URL_MIGRATOR" up
      - name: Start deterministic portal API
        working-directory: api
        run: |
          go build -o /tmp/od-portal-api ./test/portal
          nohup /tmp/od-portal-api > /tmp/od-portal-api.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8081/health > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/od-portal-api.log
          exit 1
      - name: API roster import journey
        run: pnpm --filter od-amrita-web test:api
      - name: Install Playwright Chromium
        run: pnpm --filter od-amrita-web exec playwright install --with-deps chromium
      - name: Browser persistence and authorization journey
        run: pnpm --filter od-amrita-web test:e2e:integration
      - name: Verify event audit conservation
        # Scoped to ONE event id, matched by prefix: the journey suffixes its
        # fixture name per run so repeated runs cannot leave two identically
        # named events behind, and a count across every match would then read as
        # a conservation failure caused by the feature rather than the fixture.
        run: |
          event_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id FROM events
            WHERE name LIKE 'Browser Persisted Event%'
            ORDER BY created_at DESC, id DESC
            LIMIT 1")"
          if [ -z "$event_id" ]; then
            echo "the browser journey did not create its fixture event"
            exit 1
          fi
          count="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log AS audit
            WHERE audit.target_id = '$event_id'
              AND audit.action IN ('event.created', 'event.archived')")"
          [ "$count" = "2" ] || {
            echo "expected exactly two event audit rows for event $event_id, got $count"
            exit 1
          }
      - name: Verify category audit conservation
        # Separate from the assertion above rather than loosening it: a
        # category.created row targets the categories table and can never match
        # a join against events.id.
        #
        # The journey adds exactly two categories and then attempts a duplicate,
        # which must contribute NOTHING. Asserting categories == audit rows == 2
        # is the conservation property end to end, through the browser.
        #
        # Scoped to ONE event id rather than to every event sharing the fixture
        # name. events.name carries no unique constraint and the journey creates
        # its event through the UI, so a Playwright retry or a second local run
        # leaves two identically-named events behind — and a name-filtered count
        # then reports 4 and fails as an "audit conservation" error, pointing at
        # the feature instead of at the duplicate fixture.
        run: |
          event_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id FROM events
            WHERE name LIKE 'Browser Category Event%'
            ORDER BY created_at DESC, id DESC
            LIMIT 1")"
          if [ -z "$event_id" ]; then
            echo "the browser journey did not create its fixture event"
            exit 1
          fi
          categories="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*) FROM categories WHERE event_id = '$event_id'")"
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log AS audit
            JOIN categories AS category ON audit.target_id = category.id::text
            WHERE category.event_id = '$event_id'
              AND audit.action = 'category.created'
              AND audit.target_table = 'categories'")"
          [ "$categories" = "2" ] && [ "$audits" = "2" ] || {
            echo "expected two categories and two category.created rows for event $event_id, got $categories and $audits"
            exit 1
          }
      - name: Verify coordinator audit conservation
        # The coordinator journey creates one event, assigns one fixture student,
        # repeats the same assignment as a duplicate, then archives the event.
        # Only the successful assignment may have a matching audit row.
        run: |
          event_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id FROM events
            WHERE name LIKE 'Browser Coordinator Event%'
            ORDER BY created_at DESC, id DESC
            LIMIT 1")"
          if [ -z "$event_id" ]; then
            echo "the browser journey did not create its coordinator fixture event"
            exit 1
          fi
          assignments="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM event_coordinator_assignments
            WHERE event_id = '$event_id'")"
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM event_coordinator_assignments AS assignment
            JOIN audit_log AS audit ON audit.target_id = assignment.id::text
            WHERE assignment.event_id = '$event_id'
              AND audit.action = 'coordinator.assigned'
              AND audit.target_table = 'event_coordinator_assignments'")"
          [ "$assignments" = "1" ] && [ "$audits" = "1" ] || {
            echo "expected one coordinator assignment and one coordinator.assigned row for event $event_id, got $assignments and $audits"
            exit 1
          }
      - name: Verify fallback credit audit conservation
        # THREE cap writes, not two, and the count is now fixed rather than
        # conditional. capture-credits.spec.ts sets the cap to 1, then to 0, then
        # to 2 on every run. It used to make the middle write only when no
        # teaching slot was open — so this step asserted 2 during the 08:00-18:15
        # IST window and was wrong outside it, failing for reasons unrelated to
        # whatever change happened to be pushed that evening. The determinism
        # belongs in the journey; this number just follows it.
        run: |
          event_id="93000000-0000-4000-8000-000000000001"
          coordinator_id="90000000-0000-4000-8000-000000000003"
          cap_audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log
            WHERE action = 'capture_credit.cap_changed'
              AND target_table = 'event_capture_credit_config'
              AND target_id = '$event_id'")"
          reset_audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log
            WHERE action = 'capture_credit.reset'
              AND target_table = 'event_capture_credit_usage'
              AND target_id = '$event_id:$coordinator_id'")"
          [ "$cap_audits" = "3" ] && [ "$reset_audits" = "1" ] || {
            echo "expected three capture_credit.cap_changed rows and one capture_credit.reset row for marking fixture, got $cap_audits and $reset_audits"
            exit 1
          }
      - name: Verify teacher/admin marking audit conservation
        # Exactly one search-mark lands as actor_role='teacher' in slot 4
        # (teacher-admin-attendance.spec.ts), with exactly one matching
        # od.created row, and the refused out-of-branch attempt writes no
        # od_records row at all.
        #
        # The refusal is asserted against the out-of-branch STUDENT, not against
        # the slot the spec happens to attempt. Slot 7 is a real teaching slot
        # (13:15-14:05 IST, see api/internal/service/od_record/schedule.go), and
        # every other real-stack spec marks at whatever slot the server reports
        # currently open — so a `slot = 7` predicate silently folds those
        # legitimate marks into this assertion whenever CI runs inside that
        # 50-minute window, and passes for the wrong reason the rest of the day.
        # Scoping to the student tests the refusal directly and catches a leak
        # in ANY slot, not just the one the spec asked for.
        run: |
          event_id="93000000-0000-4000-8000-000000000001"
          records="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM od_records
            WHERE event_id = '$event_id'
              AND actor_role = 'teacher'
              AND capture_method = 'search'
              AND slot = 4")"
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM od_records AS record
            JOIN audit_log AS audit ON audit.target_id = record.id::text
            WHERE record.event_id = '$event_id'
              AND record.actor_role = 'teacher'
              AND record.slot = 4
              AND audit.action = 'od.created'
              AND audit.target_table = 'od_records'")"
          [ "$records" = "1" ] && [ "$audits" = "1" ] || {
            echo "expected one teacher search-mark and one matching od.created row in slot 4, got $records and $audits"
            exit 1
          }
          refused="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM od_records AS record
            JOIN students AS student ON student.id = record.student_id
            WHERE record.event_id = '$event_id'
              AND student.roll_no = 'CB.SC.U4ECE24001'")"
          [ "$refused" = "0" ] || {
            echo "expected the out-of-branch teacher mark attempt to write nothing, got $refused rows"
            exit 1
          }
      - name: Verify public dashboard writes nothing
        # The invariant that makes an UNAUTHENTICATED endpoint safe to expose:
        # the public journey is a pure read.
        #
        # Both halves are checked because they fail differently. An extra
        # od_records row would mean a read path acquired a write; an audit_log
        # row referencing one of these records would mean the read went through
        # store.WithAudit, which is an unauthenticated write path even when the
        # OD table is untouched.
        #
        # Scoped to the two Story 0.10 fixture events and asserted as an exact
        # count, not a delta: api/test/portal/main.go seeds exactly four records
        # for them on every harness start (slots 1, 2 and 4 of the public event
        # plus slot 5 of the archived one) with plain INSERTs that write no audit
        # rows. Nothing else in the suite touches those event ids, so both
        # numbers are fixed rather than dependent on wall-clock time or on which
        # slot happens to be open — the failure mode that made an earlier gate
        # pass for the wrong reason 23 hours a day.
        run: |
          public_events="'93000000-0000-4000-8000-000000000002','93000000-0000-4000-8000-000000000003'"
          # POSITIVE CONTROL FIRST. Both assertions below are conservation
          # checks, and the seed alone already satisfies them — so with no proof
          # that the journey ran, this step is green when the public specs are
          # filtered out, skipped, or deleted outright. Unlike the sibling gates
          # there is no database trace to look for, because a read-only journey
          # is precisely what this step exists to prove; so the evidence comes
          # from the test report instead. Assert the journey happened before
          # asserting what it did not do.
          report="web/playwright-integration-report.json"
          [ -f "$report" ] || {
            echo "no Playwright integration report at $report — cannot prove the public journey ran"
            exit 1
          }
          passed="$(jq '[.suites[]? | recurse(.suites[]?)
            | .specs[]? | select(.file | test("public-attendance"))
            | select(.ok)] | length' "$report")"
          [ "${passed:-0}" -gt 0 ] || {
            echo "no public dashboard specs passed, so 'the public journey wrote nothing' is unproven —"
            echo "this gate would pass for a build with the feature removed"
            exit 1
          }
          echo "public dashboard specs passed: $passed"
          records="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*) FROM od_records WHERE event_id IN ($public_events)")"
          [ "$records" = "4" ] || {
            echo "expected the 4 seeded public-dashboard records to be unchanged by a read-only journey, got $records"
            exit 1
          }
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log AS audit
            JOIN od_records AS record ON audit.target_id = record.id::text
            WHERE record.event_id IN ($public_events)
              AND audit.target_table = 'od_records'")"
          [ "$audits" = "0" ] || {
            echo "the public dashboard wrote $audits audit rows; a public read has no actor to attribute and no state change to record"
            exit 1
          }
      - name: Verify dispute write audit conservation
        # This is separate from the public dashboard invariant above. The public
        # dashboard must stay a pure read, while the dispute journey is the one
        # unauthenticated write path. Prove the browser dispute spec ran, then
        # assert the slot-3 browser submission wrote exactly one dispute and
        # exactly one dispute.submitted audit row for that same dispute.
        run: |
          report="web/playwright-integration-report.json"
          [ -f "$report" ] || {
            echo "no Playwright integration report at $report — cannot prove the dispute journey ran"
            exit 1
          }
          passed="$(jq '[.suites[]? | recurse(.suites[]?)
            | .specs[]? | select(.file | test("student-disputes"))
            | select(.ok)] | length' "$report")"
          [ "${passed:-0}" -gt 0 ] || {
            echo "no student dispute specs passed, so the dispute write conservation check is unproven"
            exit 1
          }
          echo "student dispute specs passed: $passed"

          event_id="93000000-0000-4000-8000-000000000004"
          student_id="95000000-0000-4000-8000-000000000011"
          dispute_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id
            FROM disputes
            WHERE event_id = '$event_id'
              AND student_id = '$student_id'
              AND od_date = DATE '2026-07-28'
              AND slot = 3")"
          if [ -z "$dispute_id" ]; then
            echo "the browser dispute journey did not create its slot-3 fixture dispute"
            exit 1
          fi
          disputes="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM disputes
            WHERE event_id = '$event_id'
              AND student_id = '$student_id'
              AND od_date = DATE '2026-07-28'
              AND slot = 3")"
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log
            WHERE action = 'dispute.submitted'
              AND target_table = 'disputes'
              AND target_id = '$dispute_id'")"
          [ "$disputes" = "1" ] && [ "$audits" = "1" ] || {
            echo "expected one slot-3 dispute and one matching dispute.submitted row for $dispute_id, got $disputes and $audits"
            exit 1
          }
      - name: Verify teacher audit conservation
        # The fixture is a STABLE, non-suffixed email (unlike the events/
        # categories fixtures above): D2 makes a repeat elevation a 409 that
        # writes nothing, so a long-lived harness must be able to re-run this
        # journey indefinitely while the audit row count for that one user
        # stays at exactly 1 forever — never accumulating across CI runs and
        # never zero once the first run has landed it.
        run: |
          user_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id FROM users
            WHERE lower(email) = 'teacher-fixture-student@amrita.edu' AND role = 'teacher'")"
          if [ -z "$user_id" ]; then
            echo "the browser journey did not elevate its fixture user"
            exit 1
          fi
          count="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log AS audit
            WHERE audit.target_id = '$user_id'
              AND audit.action = 'teacher.profile_created'
              AND audit.target_table = 'users'")"
          [ "$count" = "1" ] || {
            echo "expected exactly one teacher.profile_created audit row for user $user_id, got $count"
            exit 1
          }
      - name: Verify student import audit conservation
        run: |
          imports="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM student_roster_imports
            WHERE source_filename IN ('students.csv', 'mixed-students.csv')")"
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM student_roster_imports AS roster_import
            JOIN audit_log AS audit ON audit.target_id = roster_import.id::text
            WHERE roster_import.source_filename IN ('students.csv', 'mixed-students.csv')
              AND audit.action = 'student_roster.imported'
              AND audit.target_table = 'student_roster_imports'")"
          [ "$imports" = "3" ] && [ "$audits" = "3" ] || {
            echo "expected three student imports and three student_roster.imported rows, got $imports and $audits"
            exit 1
          }
