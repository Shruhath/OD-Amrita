# OD-Amrita API contract — SINGLE SOURCE OF TRUTH.
#
# All cross-surface types are GENERATED from this file — never hand-written:
#   Go  → contracts/generated/go/types.gen.go  (oapi-codegen, DO NOT EDIT)
#   TS  → contracts/generated/ts/schema.ts      (openapi-typescript, DO NOT EDIT)
# Regenerate with `make -C contracts generate`; the CI drift-gate
# (.github/workflows/contract-drift.yml) fails if generated output is stale.
#
# VERSION IS 3.0.3 ON PURPOSE (do NOT "upgrade" to 3.1): oapi-codegen v2 uses
# kin-openapi, which cannot parse OpenAPI 3.1. 3.0.3 is the only version both
# oapi-codegen (Go) and openapi-typescript (TS) consume from one SSOT. Use
# `nullable: true` (3.0 syntax), never the 3.1 `type: [T, "null"]` union.
openapi: 3.0.3
info:
  title: OD-Amrita API
  version: 0.1.0
  description: >-
    OD-Amrita attendance/OD platform API. This spec ratifies the cross-surface
    contract shapes — /health (static liveness), the standard error envelope,
    typed validation-error details, and the 202 accept-and-enqueue batch-sync
    scan contract with UUIDv7 idempotency semantics. Handler, gin routing, DB
    and River logic are NOT part of this contract.
servers:
  - url: https://api.od-amrita.example
    description: >-
      TLS-only (NFR15) — no plain-HTTP server. Host root only: each path carries
      its own prefix (`/health` is unversioned; API routes live under `/api/v1`).

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness + DB-readiness probe
      description: >-
        Reports process liveness and database connectivity. Returns 200 with
        `{ status: "ok", db: "up" }` while the process is serving and the
        database ping succeeds; returns 503 with `{ status: "degraded",
        db: "down" }` when the database is unreachable. Load-balancers and
        orchestrators may treat 503 as not-ready.
      responses:
        "200":
          description: Service process is live and the database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >-
            Service process is live but the database is unreachable. Body still
            conforms to HealthStatus, with `db: down`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── UNAUTHENTICATED PUBLIC SURFACE (Story 0.10, FR38-FR40) ─────────────────
  #
  # The two operations below are the ONLY ones under /api/v1 that deliberately
  # omit `security`. This spec declares no root-level `security`, so under
  # OpenAPI 3.0.3 the ABSENCE of the key is what makes an operation
  # unauthenticated — do not add `security: []`, which reads as overriding a
  # global requirement that does not exist here.
  #
  # Server-side they are mounted on a group built from the ROOT gin router, a
  # SIBLING of the authenticated /api/v1 group and never a child of it: gin
  # attaches middleware to the group value rather than to the path prefix, so
  # `api.Group("/public")` would produce these exact URLs behind the auth
  # middleware and 401 every student. Only the rate limiter guards them.
  #
  # Nothing here may grow a field without a disclosure decision. The response
  # bodies are served to the open internet, so the Public* schemas are DISTINCT
  # types that never $ref an authenticated schema (see their descriptions).

  /api/v1/public/students/search:
    get:
      operationId: searchPublicStudents
      summary: Prefix-search the roster with no authentication (public dashboard)
      description: >-
        Lets a student find themselves on the public attendance dashboard
        without signing in. Matching is PREFIX-ONLY and LIKE-escaped, `q` is
        bounded at both ends so an empty query cannot become a roster dump, and
        the result cap is FIXED SERVER-SIDE at 10 — there is deliberately no
        `limit` parameter, because a knob the open internet controls is a knob
        that gets turned to 10,000. Results carry display fields only: no email
        (the students table has no such column), no card token and no token
        fingerprint. Rate limited per client.
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            Roll-number or name prefix, trimmed before length is judged. The
            bounds mirror the authenticated search's exported constants.
          schema:
            type: string
            minLength: 3
            maxLength: 64
      responses:
        "200":
          description: Matching students, exact roll match first. An empty list is a valid answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStudentSearchResults"
        "400":
          description: Query below the minimum length or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: >-
            Rate limited (RATE_LIMITED). The only refusal an anonymous caller can
            provoke on this surface; carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/public/students/{student_id}/od-records:
    get:
      operationId: listPublicStudentODRecords
      summary: One student's OD records, grouped by day and slot (public dashboard)
      description: >-
        The read that closes the loop the whole event depends on: a student
        checks whether they were actually marked. Records are grouped by the
        EVENT's date — `od_records` has no date column, and grouping by the
        server receipt time would file a teacher's next-morning correction under
        the wrong day — most recent day first, slots ascending within a day.
        Records on ARCHIVED events are still returned: archiving is an
        administrative act on the event, not a retraction of the student's
        attendance. The response exposes OD records only; the marker appears as
        a display name and a role, never a user id, an email or a contact detail.
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >-
            The student's display fields and their present OD records. A real
            student with no marks is this response with an empty `days` list —
            deliberately a different answer from the 404 below, because telling
            someone who mistyped their roll number that they were not marked is
            the most damaging wrong answer this page can give.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicODRecordCollection"
        "400":
          description: student_id is not a well-formed UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: No student matches that id (STUDENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited (RATE_LIMITED); carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/public/events:
    get:
      operationId: listPublicEvents
      summary: Public event/category options for dispute submission
      description: >-
        Minimal unauthenticated event list for a student who has no OD records
        yet but still needs to report a missed slot. The cap and ordering are
        fixed server-side; the caller supplies no filters, status, page or
        limit. Archived events are included because a dispute is commonly filed
        after the event has closed. The response deliberately carries no branch,
        coordinator, email, counts, credit or archive metadata.
      responses:
        "200":
          description: Fixed-cap event/category options, most recent event_date first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEventCollection"
        "429":
          description: Rate limited (RATE_LIMITED); carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/public/disputes:
    post:
      operationId: submitPublicDispute
      summary: Submit a missed-slot dispute without authentication
      description: >-
        First unauthenticated write in the API. The submitted email is verified
        against the configured Amrita domain family, its local-part is resolved
        to a roster roll number, and that resolved student must match the
        selected public student id. Domain rejection, unknown roll and
        email/student mismatch all return the same non-disclosing
        DISPUTE_IDENTITY_UNVERIFIED validation envelope. The write co-commits a
        dispute.submitted audit row and is guarded by both the public group
        limiter and a stricter route-level dispute limiter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicDisputeRequest"
      responses:
        "201":
          description: Dispute created and audit row co-committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDisputeReceipt"
        "400":
          description: Validation failed, including the non-disclosing identity refusal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Event or category not found (EVENT_NOT_FOUND or CATEGORY_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A matching open dispute already exists (DISPUTE_ALREADY_OPEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited (RATE_LIMITED); carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/disputes:
    get:
      operationId: listDisputes
      summary: Teacher/admin dispute inbox
      description: >-
        Authenticated inbox for missed-slot disputes. Admins see all disputes;
        teachers see only disputes for students in their assigned branches,
        scoped in SQL. Coordinators and students are refused with RBAC_FORBIDDEN.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, resolved, all]
            default: open
      responses:
        "200":
          description: Branch-scoped dispute rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeCollection"
        "400":
          description: Query validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a teacher or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/disputes/{dispute_id}/resolution:
    post:
      operationId: resolveDispute
      summary: Resolve a dispute with an annotation only
      description: >-
        Marks an open dispute resolved with a non-empty note and co-commits a
        dispute.resolved audit row. This does not create, correct or delete an
        OD record; manual record repair belongs to the later record-management
        surface.
      security:
        - bearerAuth: []
      parameters:
        - name: dispute_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisputeResolutionRequest"
      responses:
        "200":
          description: Dispute resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dispute"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller cannot resolve this dispute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Dispute not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Dispute already resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/scans:
    post:
      operationId: submitScans
      summary: Accept-and-enqueue a batch of scans (202)
      description: >-
        Accepts a batch of client-captured scans and enqueues them for durable,
        idempotent processing. Responds 202 — ACCEPTED AND ENQUEUED, not
        commit-confirmed. Each item is answered individually in `results`. The
        durable enqueue, ON CONFLICT/present-wins resolution and same-transaction
        audit are implemented later; this contract only freezes the shape so
        mobile and backend do not renegotiate it piecemeal.
      # Required even though the handler is deferred. From Story 0.10 onward,
      # OMITTING `security` is how this spec declares an endpoint public — the
      # public dashboard reads rely on exactly that — so an operation that
      # documents 401/403 while declaring no way to authenticate now reads as
      # open to the internet. Declaring it here keeps the convention honest
      # before the offline path is ever implemented.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanBatchRequest"
      responses:
        "202":
          description: Batch accepted and enqueued; per-item results follow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanBatchResponse"
        "400":
          description: Request validation failed (typed field-level details).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (RBAC).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/mark:
    post:
      operationId: markAttendance
      summary: Synchronously mark one student present for the current event slot
      description: >-
        Live one-event MVP marking path. The server resolves either a card token
        or direct student id, derives coordinator slots from server time, writes
        one OD record and one audit row in the same transaction, and rejects
        duplicate present records through the database uniqueness guarantee.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAttendanceRequest"
      responses:
        "201":
          description: Attendance mark was committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAttendanceResult"
        "400":
          description: Request validation failed (typed field-level details).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (RBAC).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event, category, or student was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate scan, closed slot, or archived event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Card token was not recognized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Camera/search fallback credit limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/mark/status:
    get:
      operationId: getMarkStatus
      summary: Server-computed marking counters and the active slot window
      description: >-
        The single source of truth behind the coordinator marking screen's two
        counters and its slot countdown. `server_time` is read from the same
        clock read that decided the slot, so the client's countdown and the
        server's slot decision can never disagree by a poll interval. The client
        never computes a slot boundary and never counts a mark itself.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server time, the active slot window (or null), and both counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkStatus"
        "400":
          description: Missing or malformed scope parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller may not mark for this event and category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or category was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Event is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/portal/mark/events:
    get:
      operationId: listPortalMarkEvents
      summary: List active events available to the teacher/admin search-mark surface
      description: >-
        Authenticated teacher/admin search-mark event read. Teachers see active
        events that include at least one of their associated branches; admins see
        all active events. This is deliberately separate from the coordinator
        `/api/v1/events` surface so teacher/admin access cannot widen coordinator
        NFC/camera marking semantics.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deterministically ordered page of active markable events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCollection"
        "400":
          description: Invalid pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a teacher or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/portal/mark/events/{event_id}/categories:
    get:
      operationId: listPortalMarkEventCategories
      summary: List categories available to the teacher/admin search-mark surface
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Categories for an active event the caller may search-mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "400":
          description: Malformed event id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller may not search-mark for this event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Event is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}/attendance:
    get:
      operationId: listAdminEventAttendance
      summary: List present attendance records for one event
      description: >-
        Admin-only event verification read. Filters are applied server-side
        before pagination, returns present OD rows only, and exposes display and
        actor fields needed to verify the live event without revealing card
        tokens, fingerprints, fallback-credit internals, disputes, reasons, or
        private student email.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: slot
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of attendance rows for the requested event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecordCollection"
        "400":
          description: Invalid filter or pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/events:
    get:
      operationId: listMarkableEvents
      summary: List the active events the caller may mark for
      description: >-
        The coordinator marking surface's scoped event read. A sibling of
        `/api/v1/admin/events`, never a replacement: this one is authenticated
        rather than admin-gated and returns ACTIVE events only, so the marking
        selector can never offer an event the mark path would refuse.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deterministically ordered page of markable active events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCollection"
        "400":
          description: Invalid pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller holds no role that may mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/events/{event_id}/categories:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMarkableEventCategories
      summary: List the categories of an event the caller may mark for
      security:
        - bearerAuth: []
      responses:
        "200":
