# pnpm workspace root for the OD-Amrita monorepo.
# The contract is a path/workspace reference, NOT a published package
# (AR1 / architecture#Contract-Wiring): mobile/ and web/ depend on
# "@od-amrita/contracts": "workspace:*" resolved from contracts/generated/ts.
packages:
  - contracts/generated/ts
  - mobile
  - web
allowBuilds:
  # Its optional postinstall only prints project messaging; tests do not need it.
  msw: false
# Required, not inert: a global pnpm `minimumReleaseAge` cooldown is active, so
# these recently-published Expo packages must be excluded or `--frozen-lockfile`
# rejects them. pnpm auto-manages this list on install — do not remove.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.3'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.3'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-dev-client@57.0.4
  - expo-dev-launcher@57.0.4
  - expo-dev-menu@57.0.4
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo@57.0.1
