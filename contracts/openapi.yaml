# OD-Amrita API contract — SINGLE SOURCE OF TRUTH.
#
# All cross-surface types are GENERATED from this file — never hand-written:
#   Go  → contracts/generated/go/types.gen.go  (oapi-codegen, DO NOT EDIT)
#   TS  → contracts/generated/ts/schema.ts      (openapi-typescript, DO NOT EDIT)
# Regenerate with `make -C contracts generate`; the CI drift-gate
# (.github/workflows/contract-drift.yml) fails if generated output is stale.
#
# VERSION IS 3.0.3 ON PURPOSE (do NOT "upgrade" to 3.1): oapi-codegen v2 uses
# kin-openapi, which cannot parse OpenAPI 3.1. 3.0.3 is the only version both
# oapi-codegen (Go) and openapi-typescript (TS) consume from one SSOT. Use
# `nullable: true` (3.0 syntax), never the 3.1 `type: [T, "null"]` union.
openapi: 3.0.3
info:
  title: OD-Amrita API
  version: 0.1.0
  description: >-
    OD-Amrita attendance/OD platform API. This spec ratifies the cross-surface
    contract shapes — /health (static liveness), the standard error envelope,
    typed validation-error details, and the 202 accept-and-enqueue batch-sync
    scan contract with UUIDv7 idempotency semantics. Handler, gin routing, DB
    and River logic are NOT part of this contract.
servers:
  - url: https://api.od-amrita.example
    description: >-
      TLS-only (NFR15) — no plain-HTTP server. Host root only: each path carries
      its own prefix (`/health` is unversioned; API routes live under `/api/v1`).

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness + DB-readiness probe
      description: >-
        Reports process liveness and database connectivity. Returns 200 with
        `{ status: "ok", db: "up" }` while the process is serving and the
        database ping succeeds; returns 503 with `{ status: "degraded",
        db: "down" }` when the database is unreachable. Load-balancers and
        orchestrators may treat 503 as not-ready.
      responses:
        "200":
          description: Service process is live and the database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >-
            Service process is live but the database is unreachable. Body still
            conforms to HealthStatus, with `db: down`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/scans:
    post:
      operationId: submitScans
      summary: Accept-and-enqueue a batch of scans (202)
      description: >-
        Accepts a batch of client-captured scans and enqueues them for durable,
        idempotent processing. Responds 202 — ACCEPTED AND ENQUEUED, not
        commit-confirmed. Each item is answered individually in `results`. The
        durable enqueue, ON CONFLICT/present-wins resolution and same-transaction
        audit are implemented later; this contract only freezes the shape so
        mobile and backend do not renegotiate it piecemeal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanBatchRequest"
      responses:
        "202":
          description: Batch accepted and enqueued; per-item results follow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanBatchResponse"
        "400":
          description: Request validation failed (typed field-level details).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (RBAC).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/mark:
    post:
      operationId: markAttendance
      summary: Synchronously mark one student present for the current event slot
      description: >-
        Live one-event MVP marking path. The server resolves either a card token
        or direct student id, derives coordinator slots from server time, writes
        one OD record and one audit row in the same transaction, and rejects
        duplicate present records through the database uniqueness guarantee.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAttendanceRequest"
      responses:
        "201":
          description: Attendance mark was committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAttendanceResult"
        "400":
          description: Request validation failed (typed field-level details).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden (RBAC).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event, category, or student was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate scan, closed slot, or archived event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Card token was not recognized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/mark/status:
    get:
      operationId: getMarkStatus
      summary: Server-computed marking counters and the active slot window
      description: >-
        The single source of truth behind the coordinator marking screen's two
        counters and its slot countdown. `server_time` is read from the same
        clock read that decided the slot, so the client's countdown and the
        server's slot decision can never disagree by a poll interval. The client
        never computes a slot boundary and never counts a mark itself.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Server time, the active slot window (or null), and both counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkStatus"
        "400":
          description: Missing or malformed scope parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller may not mark for this event and category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or category was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Event is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/events:
    get:
      operationId: listMarkableEvents
      summary: List the active events the caller may mark for
      description: >-
        The coordinator marking surface's scoped event read. A sibling of
        `/api/v1/admin/events`, never a replacement: this one is authenticated
        rather than admin-gated and returns ACTIVE events only, so the marking
        selector can never offer an event the mark path would refuse.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deterministically ordered page of markable active events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCollection"
        "400":
          description: Invalid pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller holds no role that may mark.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/events/{event_id}/categories:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMarkableEventCategories
      summary: List the categories of an event the caller may mark for
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every category belonging to the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "400":
          description: Malformed event id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller may not mark for this event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Event is archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/students/search:
    get:
      operationId: searchStudents
      summary: Prefix-search the roster by roll number or name
      description: >-
        The coordinator's fallback when a card will not tap, and the resolution
        step for the camera path (the printed barcode carries a ROLL NUMBER).
        Matching is PREFIX-ONLY so `students_roll_no_idx` and
        `students_name_lower_idx` stay usable, `q` is bounded at both ends so an
        empty query cannot become a roster dump, and the result item carries no
        email, card token or token fingerprint.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Roll-number or name prefix, trimmed before length is judged.
          schema:
            type: string
            minLength: 3
            maxLength: 64
        - name: limit
          in: query
          description: Server-bounded result cap.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching students, exact roll match first. An empty list is a valid answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSearchResults"
        "400":
          description: Query below the minimum length or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller holds no role that may search the roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/me:
    get:
      operationId: getAuthenticatedIdentity
      summary: Return the authenticated user's verified identity
      description: >-
        Validates the Supabase bearer JWT, re-enforces the amrita.edu domain
        family server-side, and returns the identity claims loaded by auth
        middleware. This endpoint proves the authenticated round trip and is the
        future home of first-login user/role provisioning.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verified Amrita identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedIdentity"
        "401":
          description: Missing, malformed, expired, or otherwise invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated identity is outside the amrita.edu domain family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/users/{user_id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: Force-logout a user by revoking their Supabase-backed sessions
      description: >-
        Admin-only forced logout. Records a server-side session revocation for
        the target user in the local deny-list the auth middleware enforces on
        the NEXT request (not only at token expiry), and makes a best-effort
        Supabase-side revocation where a supported server-side API exists.
        Supabase remains the session authority; this endpoint never mints or
        stores tokens. The revocation is audit-logged.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: Application user id (users.id) of the account to force-log-out.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionsRequest"
      responses:
        "200":
          description: >-
            Revocation recorded. Idempotent for a repeated session revoke
            (already_revoked=true, no new audit row).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResult"
        "400":
          description: >-
            Request validation failed. The shared error middleware renders every
            error as the {code, message} envelope, so a 400 carries
            code=VALIDATION_FAILED and a human-readable message (no typed
            details array on this endpoint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/branches:
    get:
      operationId: listAdminBranches
      summary: List normalized branches available for event administration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server-owned branch reference data, ordered by code then id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchCollection"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events:
    get:
      operationId: listAdminEvents
      summary: List active and archived events across every branch
      description: >-
        Includes active and archived events by default. Results are ordered by
        event_date DESC, created_at DESC, id DESC.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Lifecycle filter. `all` preserves discoverable history.
          schema:
            type: string
            enum: [active, archived, all]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deterministically ordered page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCollection"
        "400":
          description: Invalid lifecycle filter or pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminEvent
      summary: Create a multi-branch event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event and branch associations persisted atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}:
    get:
      operationId: getAdminEvent
      summary: Read one event by id
      description: >-
        The item read behind every per-event admin surface. Without it a client
        has to scan the paginated collection and filter locally, which silently
        stops working once the event count outgrows one page.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}/archive:
    post:
      operationId: archiveAdminEvent
      summary: Irreversibly archive an event
      description: >-
        Transitions an active event to archived. Repeating the command is an
        idempotent read: it returns the same resource and creates no audit row.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current archived representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}/categories:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAdminEventCategories
      summary: List the categories belonging to one event
      description: >-
        Categories are bounded per-event reference data, so the collection is
        unpaginated. Results are ordered by name ASC, id ASC. An archived event
        remains readable — only writing is closed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every category of the requested event, in server order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminEventCategory
      summary: Add one category to an event
      description: >-
        Adds a single category. Several categories are added by repeating the
        command. Names are compared case-insensitively after trimming and must be
        unique within the event; a repeat is rejected as a typed field error.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category persisted under the event with its audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: >-
            Request validation failed with typed field details, including a
            duplicate name within the same event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The event is archived. An archived event is a closed aggregate and
            accepts no child writes (EVENT_ARCHIVED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}/coordinators:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAdminEventCoordinators
      summary: List event-level coordinator assignments
      description: >-
        Lists the provisioned users assigned to coordinate the whole event.
        Results are bounded per-event reference data and remain readable after
        an event is archived.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every coordinator assignment for the requested event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinatorAssignmentCollection"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminEventCoordinatorAssignment
      summary: Assign one provisioned user as an event coordinator
      description: >-
        Elevates an existing student to coordinator on first assignment, or
        adds another event assignment for an existing coordinator. Duplicate
        user/event assignments are rejected with COORDINATOR_ASSIGNMENT_EXISTS.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCoordinatorAssignmentRequest"
      responses:
        "201":
          description: Coordinator assignment persisted atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoordinatorAssignment"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or user was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Duplicate assignment, archived event, or ineligible role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/teachers:
    get:
      operationId: listAdminTeachers
      summary: List teacher profiles across every branch
      description: >-
        The teacher roster scales with institution headcount, so results are
        paginated like events (unlike the bounded branch/category reference
        data). Results are ordered by email ASC, id ASC.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Deterministically ordered page of teacher profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfileCollection"
        "400":
          description: Invalid pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminTeacherProfile
      summary: Elevate an existing provisioned user to teacher and associate branches
      description: >-
        Teacher-profile creation ELEVATES an existing, already-provisioned
        `users` row (someone who has signed in at least once) — it does not
        pre-provision an identity that has never logged in. Role elevation and
        every branch association from one request co-commit as exactly one
        audit row.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherProfileRequest"
      responses:
        "201":
          description: Role elevated and branch associations persisted atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No `users` row exists for the supplied email (USER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The user already has a non-student role (ROLE_ALREADY_ASSIGNED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/students/import:
    post:
      operationId: importAdminStudents
      summary: Import the student roster from a UTF-8 CSV
      description: >-
        Admin-only roster import. The CSV is uploaded as multipart field `file`.
        Rows are reconciled by canonical roll number; valid rows commit even
        when other rows are invalid. A malformed file or an upload with zero
        valid data rows is rejected with typed validation details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Valid rows imported and reconciliation counts returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRosterImportResult"
        "400":
          description: Request, CSV, or zero-valid-row validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/students:
    get:
      operationId: listAdminStudents
      summary: List students for card-populator selection
      description: >-
        Admin-only, database-backed roster read used to select a student before
        sealing and writing their NFC card. Results are ordered by branch code,
        then batch, then canonical roll_no, then id as a tiebreaker. Never
        exposes email or card-token material.
      security:
        - bearerAuth: []
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: batch
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: section
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Deterministically ordered page of students.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentCollection"
        "400":
          description: Invalid filter or pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/students/{student_id}/card-seal:
    post:
      operationId: sealAdminStudentCard
      summary: Seal one student's NFC card token
      description: >-
        Admin-only card-populator endpoint. Returns the active seal version, the
        HMAC token, and the exact card payload to write. The card payload carries
        only version and token; student identity is resolved server-side later.
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          description: Student row id to seal for the active card-token version.
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Token sealed and ledgered for the selected student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardSeal"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No `students` row exists for the supplied id (STUDENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/card-tokens/resolve:
    post:
      operationId: resolveAdminCardToken
      summary: Resolve a sealed card token for populator verification
      description: >-
        Admin-only verification endpoint for the card populator. Unknown,
        malformed, disabled-version, or absent-ledger tokens all return the same
        CARD_NOT_RECOGNIZED response so callers cannot enumerate valid versions
        or token prefixes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardTokenResolveRequest"
      responses:
        "200":
          description: Token matched a ledgered student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedCardStudent"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Token was not recognized (CARD_NOT_RECOGNIZED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BranchSummary:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 160

    BranchCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BranchSummary"

    EventStatus:
      type: string
      enum: [active, archived]

    Event:
      type: object
      required: [id, name, event_date, status, branches, created_at, archived_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        event_date:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/EventStatus"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchSummary"
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true

    CreateEventRequest:
      type: object
      required: [name, event_date, branch_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed, nonblank event name.
        event_date:
          type: string
          format: date
        branch_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    EventCollection:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    Category:
      type: object
      description: >-
        An activity within one event (e.g. Procession, Stage Setup). A category
        has no identity without its event, which is why event_id is part of the
        resource and the operations are nested under the event.
      required: [id, event_id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Trimmed, nonblank category name. Unique within the event, compared
            case-insensitively after trimming.

    CategoryCollection:
      type: object
      description: >-
        Bounded per-event reference data — deliberately unpaginated, like
        BranchCollection and unlike EventCollection.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CoordinatorAssignment:
      type: object
      description: >-
        Event-level coordinator assignment. A row grants the user coordinator
        marking access for the whole event; it carries no category or scope
        field in this MVP.
      required: [id, user_id, email, name, event_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
          nullable: true
        event_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CoordinatorAssignmentCollection:
      type: object
      description: >-
        Bounded per-event reference data, ordered by assignment creation time.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CoordinatorAssignment"

    CreateCoordinatorAssignmentRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
          description: >-
            Email of an existing, already-provisioned users row. The request
            does not pre-provision an identity.

    TeacherProfile:
      type: object
      description: >-
        A teacher's elevated role plus the branches they are associated with.
        Reuses BranchSummary rather than a parallel branch shape.
      required: [user_id, email, branches, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
          nullable: true
          description: Optional — some providers omit a display name.
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchSummary"
        created_at:
          type: string
          format: date-time

    TeacherProfileCollection:
      type: object
      description: >-
        The teacher roster scales with institution headcount — paginated like
        EventCollection, unlike CategoryCollection/BranchCollection.
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TeacherProfile"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    CreateTeacherProfileRequest:
      type: object
      required: [email, branch_ids]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
          description: >-
            Email of an existing, already-provisioned users row. Resolved
            server-side; the request does not pre-provision an identity.
        branch_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    StudentRosterImportResult:
      type: object
      required: [import_id, total_rows, inserted_rows, updated_rows, unchanged_rows, invalid_rows, database_count, errors]
      properties:
        import_id:
          type: string
          format: uuid
        total_rows:
          type: integer
          minimum: 0
        inserted_rows:
          type: integer
          minimum: 0
        updated_rows:
          type: integer
          minimum: 0
        unchanged_rows:
          type: integer
          minimum: 0
        invalid_rows:
          type: integer
          minimum: 0
        database_count:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/StudentRosterImportError"

    StudentRosterImportError:
      type: object
      required: [row, field, code, message]
      properties:
        row:
          type: integer
          minimum: 1
        field:
          type: string
        code:
          type: string
        message:
          type: string

    StudentCollection:
      type: object
      description: >-
        The card-populator roster read. Paginated like EventCollection, and
        deliberately bounded to display fields only — no email or card-token
        material.
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedCardStudent"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    ResolvedCardStudent:
      type: object
      required: [student_id, roll_no, display_name, branch, section, batch]
      properties:
        student_id:
          type: string
          format: uuid
        roll_no:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        branch:
          type: string
          minLength: 1
          maxLength: 32
        section:
          type: string
          minLength: 1
          maxLength: 32
        batch:
          type: string
          minLength: 1
          maxLength: 32

    CardSeal:
      type: object
      required: [student, version, token, payload]
      properties:
        student:
          $ref: "#/components/schemas/ResolvedCardStudent"
        version:
          type: string
          minLength: 1
          maxLength: 16
        token:
          type: string
          minLength: 43
          maxLength: 128
        payload:
          type: object
          required: [version, token]
          additionalProperties: false
          properties:
            version:
              type: string
              minLength: 1
              maxLength: 16
            token:
              type: string
              minLength: 43
              maxLength: 128

    CardTokenResolveRequest:
      type: object
      required: [version, token]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 16
        token:
          type: string
          minLength: 43
          maxLength: 128

    CaptureMethod:
      type: string
      enum: [nfc, camera, search]
      x-enum-varnames: [Nfc, Camera, Search]

    StudentSearchResults:
      type: object
      description: >-
        The authenticated roster search read. Deliberately unpaginated — the
        server caps the result count instead — and bounded to display fields
        only: `students` has no email column and card tokens are stored as
        fingerprints, so neither can appear here.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedCardStudent"

    MarkStatus:
      type: object
      description: >-
        Everything the marking screen needs that the client must not compute for
        itself. `slot: null` is the explicit "no slot is open" state — never
        slot 0 — and `server_time` shares one clock read with the slot decision.
      # `slot` is REQUIRED as well as nullable: it is always present, and it is
      # null when no slot is open. Leaving it merely optional lets the generator
      # emit `omitempty`, which omits the key entirely — and a client then cannot
      # tell "no slot is open" from "this server is too old to report slots".
      required: [server_time, slot, counters]
      properties:
        server_time:
          type: string
          format: date-time
        slot:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MarkSlotWindow"
        counters:
          $ref: "#/components/schemas/MarkCounters"

    MarkSlotWindow:
      type: object
      description: The bounds of the currently active slot, in server time.
      required: [slot, started_at, ends_at]
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 12
        started_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    MarkCounters:
      type: object
      description: >-
        Both figures are server-computed live counts over od_records (FR13).
        `mine` is the calling coordinator's marks for this event and category;
        `category_total` is every coordinator's, and is identical for all callers.
      required: [mine, category_total]
      properties:
        mine:
          type: integer
          minimum: 0
        category_total:
          type: integer
          minimum: 0

    MarkAttendanceRequest:
      type: object
      description: >-
        Exactly one identity, paired with the capture method that produced it.
        `card` is valid for `nfc` and `camera`; `student_id` is valid for
        `camera` and `search`. The camera pairs with BOTH because the barcode
        printed on the physical university ID card carries a ROLL NUMBER, not a
        sealed token — the client resolves that roll to a student_id through
        `GET /api/v1/students/search` and marks with `capture_method: camera`.
        `capture_method` is persisted truthfully on the record and its audit row.
      required: [event_id, category_id, capture_method]
      oneOf:
        - type: object
          required: [student_id]
          properties:
            student_id:
              type: string
              format: uuid
          not:
            required: [card]
        - type: object
          required: [card]
          properties:
            card:
              $ref: "#/components/schemas/CardTokenResolveRequest"
          not:
            required: [student_id]
      properties:
        event_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        capture_method:
          type: string
          enum: [nfc, camera, search]
        student_id:
          type: string
          format: uuid
        card:
          $ref: "#/components/schemas/CardTokenResolveRequest"
        slot:
          type: integer
          minimum: 1.0
          maximum: 12.0

    MarkAttendanceResult:
      type: object
      required:
        - record_id
        - student
        - event_id
        - category_id
        - slot
        - capture_method
        - server_received_at
      properties:
        record_id:
          type: string
          format: uuid
        student:
          $ref: "#/components/schemas/MarkedStudent"
        event_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        slot:
          type: integer
          minimum: 1.0
          maximum: 12.0
        capture_method:
          $ref: "#/components/schemas/CaptureMethod"
        server_received_at:
          type: string
          format: date-time

    MarkedStudent:
      type: object
      required: [student_id, roll_no, display_name, branch, section, batch]
      properties:
        student_id:
          type: string
          format: uuid
        roll_no:
          type: string
        display_name:
          type: string
        branch:
          type: string
        section:
          type: string
        batch:
          type: string

    HealthStatus:
      type: object
      description: >-
        Health probe shape — overall service status plus database connectivity.
      required:
        - status
        - db
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: >-
            Overall service status. "ok" when every dependency is reachable;
            "degraded" (served with HTTP 503) when the database is not.
        db:
          type: string
          enum:
            - up
            - down
          description: >-
            Database connectivity as observed by a live ping from the runtime
            pool. "down" is reported with HTTP 503.

    Error:
      type: object
      description: >-
        Standard error envelope for all non-2xx responses. Clients branch on
        `code`, never on `message`.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            Canonical SCREAMING_SNAKE error code. This enum is the WIRE source of
            truth; the Go `errors.go` const registry mirrors it. Do not invent
            free-text codes.
          enum:
            - AUTH_DOMAIN_REJECTED
            - AUTH_TOKEN_INVALID
            - RBAC_FORBIDDEN
            - SCAN_DUPLICATE
            - SLOT_CLOSED
            - CARD_NOT_RECOGNIZED
            - QR_LIMIT_REACHED
            - RATE_LIMITED
            - INVALID_SCAN_ID
            - VALIDATION_FAILED
            - EVENT_NOT_FOUND
            - EVENT_ARCHIVED
            - CATEGORY_NOT_FOUND
            - USER_NOT_FOUND
            - STUDENT_NOT_FOUND
            - ROLE_ALREADY_ASSIGNED
            - COORDINATOR_ASSIGNMENT_EXISTS
            - INTERNAL
        message:
          type: string
          description: Human-readable message. For diagnostics/display only — branch on `code`.
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Optional, freeform context for generic errors. Typed validation
            failures use ValidationError.details (a typed array) instead.

    AuthenticatedIdentity:
      type: object
      description: >-
        Identity claims verified from the Supabase JWT and accepted by the
        backend amrita.edu domain-family gate.
      required:
        - email
        - subject
        - role
      properties:
        email:
          type: string
          description: Verified email claim from the Supabase session JWT.
        name:
          type: string
          description: >-
            Display name from Supabase user_metadata.name. Optional: some
            providers omit it, so the backend returns it only when present.
        subject:
          type: string
          description: Stable Supabase auth subject (`sub`) for the identity.
        role:
          $ref: "#/components/schemas/AuthenticatedIdentityRole"

    AuthenticatedIdentityRole:
      type: string
      description: >-
        The global base role the identity is provisioned with on first login.
        Always present (provisioning yields exactly one). This is the base role
        only — per-event coordinator assignment and RBAC enforcement are later
        epics; the client uses it to route by role.
      enum:
        - admin
        - teacher
        - coordinator
        - student

    RevokeSessionsRequest:
      type: object
      description: >-
        Forced-logout request. `scope` is required and explicit — the server
        never infers it. `session_id` is required (and a UUID) iff `scope` is
        `session`, and MUST be absent when `scope` is `all`.
      required:
        - scope
        - reason
      properties:
        scope:
          type: string
          description: >-
            `all` revokes every session for the user (a later re-login is a fresh
            session); `session` revokes exactly one session.
          enum:
            - all
            - session
        session_id:
          type: string
          format: uuid
          nullable: true
          description: The Supabase session id to revoke. Required iff `scope` is `session`.
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Human-readable reason for the forced logout (recorded in the audit log).

    SessionRevocationResult:
      type: object
      description: Result of recording a forced-logout revocation.
      required:
        - revocation_id
        - already_revoked
      properties:
        revocation_id:
          type: string
          description: Id of the deny-list revocation record.
        already_revoked:
          type: boolean
          description: >-
            True when this exact session was already revoked (an idempotent
            no-op; no new audit row was written).

    ValidationErrorDetail:
      type: object
      description: One typed, field-level validation failure.
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Offending request field path (e.g. `scans[0].method`).
        code:
          type: string
          description: Machine-readable field-level code (e.g. `required`, `invalid_format`).
        message:
          type: string
          description: Human-readable description of the field violation.

    ValidationError:
      type: object
      description: >-
        400 validation error — the error envelope whose `details` is a TYPED
        array of field-level failures (AC3), not a freeform object.
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: Always VALIDATION_FAILED for validation (400) responses.
          enum:
            - VALIDATION_FAILED
        message:
          type: string
          description: Human-readable summary of the validation failure.
        details:
          type: array
          description: Typed, per-field validation failures (AC3).
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"

    ScanItem:
      type: object
      description: >-
        A single client-captured scan. Wire field names are snake_case and
        LOCKED end-to-end (no camelCase anywhere on the wire).
      required:
        - id
        - event_id
        - slot
        - method
        - client_scanned_at
        - card_token
      properties:
        id:
          type: string
          description: >-
            Client-generated UUIDv7 — the SOLE idempotency key and primary key
            for this scan. The server rejects any non-UUID or non-v7 value with
            INVALID_SCAN_ID. The embedded UUIDv7 timestamp MUST NEVER be used for
            ordering or conflict resolution; server-authoritative time governs.
        event_id:
          type: string
          description: UUID of the event this scan belongs to.
        slot:
          type: integer
          description: The event slot (time window) in which the scan was captured.
        method:
          type: string
          description: Capture method used for this scan.
          enum:
            - barcode
            - qr
            - nfc
        client_scanned_at:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp captured on the client at scan time. Advisory
            only — server-authoritative time governs resolution.
        card_token:
          type: string
          description: >-
            Raw scanned card/roll payload (NFC card UID, or the barcode/QR code
            value).

    ScanBatchRequest:
      type: object
      description: >-
        Batch scan-sync request. The batch is wrapped under a `scans` array
        (not a bare top-level array) to leave room for future top-level fields
        such as `device_id`.
      required:
        - scans
      properties:
        scans:
          type: array
          description: The batch of scans to accept-and-enqueue.
          items:
            $ref: "#/components/schemas/ScanItem"

    ScanResult:
      type: object
      description: Per-item result for one submitted scan, correlated by `id`.
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: The UUIDv7 `id` echoed from the corresponding request ScanItem.
        status:
          type: string
          description: >-
            Per-item outcome. `applied` = newly accepted/enqueued;
            `duplicate` = idempotency key already seen (safe no-op);
            `rejected` = not accepted (see `reason`).
          enum:
            - applied
            - duplicate
            - rejected
        reason:
          type: string
          nullable: true
          description: >-
            Present when `status` is `rejected`. Distinguishes PERMANENT
            rejections (quarantine — client must NOT retry) from TRANSIENT
            rejections (client may retry) so the client never sync-loops.

    ScanBatchResponse:
      type: object
      description: >-
        202 accept-and-enqueue response. 202 means ACCEPTED, not
        commit-confirmed — safe-to-evict is a later lifecycle signal.
      required:
        - results
      properties:
        results:
          type: array
          description: One result per submitted scan, correlated by `id`.
          items:
            $ref: "#/components/schemas/ScanResult"
