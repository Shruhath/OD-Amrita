# sqlc configuration (placeholder). Real query/schema wiring lands in Stories
# 1.3–1.4 once db/migrations and db/queries have content. sqlc generates typed
# Go into internal/store/sqlc (DO NOT EDIT that output by hand).
version: "2"
sql:
  - engine: postgresql
    # queries + schema are populated in Story 1.3; left empty so `sqlc generate`
    # is a no-op on the skeleton (CI sqlc-compile check is added when non-empty).
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
