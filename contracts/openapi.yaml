  /api/v1/admin/students/import:
    post:
      operationId: importAdminStudents
      summary: Import the student roster from a UTF-8 CSV
      description: >-
        Admin-only roster import. The CSV is uploaded as multipart field `file`.
        Rows are reconciled by canonical roll number; valid rows commit even
        when other rows are invalid. A malformed file or an upload with zero
        valid data rows is rejected with typed validation details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Valid rows imported and reconciliation counts returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRosterImportResult"
        "400":
          description: Request, CSV, or zero-valid-row validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/students:
    get:
      operationId: listAdminStudents
      summary: List students for card-populator selection
      description: >-
        Admin-only, database-backed roster read used to select a student before
        sealing and writing their NFC card. Results are ordered by branch code,
        then batch, then canonical roll_no, then id as a tiebreaker. Never
        exposes email or card-token material.
      security:
        - bearerAuth: []
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: batch
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: section
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 32
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Deterministically ordered page of students.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentCollection"
        "400":
          description: Invalid filter or pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/students/{student_id}/card-seal:
    post:
      operationId: sealAdminStudentCard
      summary: Seal one student's NFC card token
      description: >-
        Admin-only card-populator endpoint. Returns the active seal version, the
        HMAC token, and the exact card payload to write. The card payload carries
        only version and token; student identity is resolved server-side later.
      security:
        - bearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          description: Student row id to seal for the active card-token version.
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Token sealed and ledgered for the selected student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardSeal"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No `students` row exists for the supplied id (STUDENT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/card-tokens/resolve:
    post:
      operationId: resolveAdminCardToken
      summary: Resolve a sealed card token for populator verification
      description: >-
        Admin-only verification endpoint for the card populator. Unknown,
        malformed, disabled-version, or absent-ledger tokens all return the same
        CARD_NOT_RECOGNIZED response so callers cannot enumerate valid versions
        or token prefixes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardTokenResolveRequest"
      responses:
        "200":
          description: Token matched a ledgered student.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedCardStudent"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Token was not recognized (CARD_NOT_RECOGNIZED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/card-tokens/status:
    get:
      operationId: listSectionCardStatus
      summary: Durable card-population progress for one section
      description: >-
        What the SERVER knows about a section's cards, so the populator's counts
        survive a sign-out and follow the operator to another device. `issued`
        means a token row exists — NOT that the card took the write. `verified_at`
        is set only when an admin read the card back through the resolve endpoint
        above and the server recognised it, and that is the only state that may
        be reported as done. Scoped to the ACTIVE seal version: a token sealed
        under a retired key is not the card about to be written. Carries no
        token, fingerprint or key material.
      security:
        - bearerAuth: []
      parameters:
        - name: branch_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: batch
          in: query
          required: true
          schema:
            type: string
            maxLength: 32
        - name: section
          in: query
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: One entry per student in the section, in roll-number order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionCardStatusCollection"
        "400":
          description: Request validation failed with typed field details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BranchSummary:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 160

    BranchCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BranchSummary"

    EventStatus:
      type: string
      enum: [active, archived]

    Event:
      type: object
      required: [id, name, event_date, end_date, status, branches, created_at, archived_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        event_date:
          type: string
          format: date
          description: >-
            FIRST day of the event's range. Deliberately not renamed to
            `start_date`; `end_date` is the last day.
        end_date:
          type: string
          format: date
          description: >-
            Last day of the event's range, equal to `event_date` for a one-day
            event. Required because the server always has one — every event
            predating the range was backfilled to a single day.
        status:
          $ref: "#/components/schemas/EventStatus"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchSummary"
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true

    CreateEventRequest:
      type: object
      required: [name, event_date, branch_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed, nonblank event name.
        event_date:
          type: string
          format: date
          description: First day of the event's range.
        end_date:
          type: string
          format: date
          description: >-
            Last day of the event's range. OPTIONAL, and omitting it creates a
            one-day event — which is what makes "an event created with a single
            day behaves exactly as before" true at the API boundary. Must not be
            before `event_date`; the range is bounded at 90 days inclusive.
        branch_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    EventCollection:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    Category:
      type: object
      description: >-
        An activity within one event (e.g. Procession, Stage Setup). A category
        has no identity without its event, which is why event_id is part of the
        resource and the operations are nested under the event.
      required: [id, event_id, name, visible_on_public_dashboard, created_at]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        name:
          type: string
        visible_on_public_dashboard:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: >-
            Trimmed, nonblank category name. Unique within the event, compared
            case-insensitively after trimming.

    CategoryCollection:
      type: object
      description: >-
        Bounded per-event reference data — deliberately unpaginated, like
        BranchCollection and unlike EventCollection.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CoordinatorAssignment:
      type: object
      description: >-
        Event-level coordinator eligibility plus category assignments. The
        event row admits the coordinator to the event; assigned categories are
        the only categories they may mark in.
      required: [id, user_id, email, name, event_id, categories, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
          nullable: true
        event_id:
          type: string
          format: uuid
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        created_at:
          type: string
          format: date-time

    CoordinatorAssignmentCollection:
      type: object
      description: >-
        Bounded per-event reference data, ordered by assignment creation time.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CoordinatorAssignment"

    CreateCoordinatorAssignmentRequest:
      type: object
      required: [email, category_ids]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
          description: >-
            Email of an existing, already-provisioned users row. The request
            does not pre-provision an identity.
        category_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    UpdateCategoryVisibilityRequest:
      type: object
      required: [visible_on_public_dashboard]
      properties:
        visible_on_public_dashboard:
          type: boolean

    UpdateCategoryAccessRequest:
      type: object
      required: [category_ids]
      properties:
        category_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    CaptureCreditUsage:
      type: object
      description: >-
        One assigned coordinator's camera/search credit usage for a SINGLE DAY —
        the campus-local day of the request. The `limit` is the cap stored on
        that coordinator's assignment, so admins can change one coordinator
        without changing any other coordinator on the same event.
      required: [event_id, user_id, email, name, limit, consumed, remaining, exhausted]
      properties:
        event_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
          nullable: true
        limit:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Coordinator-specific fallback cap; zero disables camera/search only for this coordinator.
        consumed:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        exhausted:
          type: boolean

    CaptureCreditSummary:
      type: object
      description: Bounded coordinator usage rows. There is no unified mutable event cap.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CaptureCreditUsage"

    UpdateCaptureCreditLimitRequest:
      type: object
      required: [limit]
      properties:
        limit:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Zero deliberately disables camera/search fallback modes for this coordinator only.

    TeacherProfile:
      type: object
      description: >-
        A teacher's elevated role plus the branches and categories they are
        associated with.
      required: [user_id, email, branches, categories, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
          nullable: true
          description: Optional — some providers omit a display name.
        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchSummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        created_at:
          type: string
          format: date-time

    TeacherProfileCollection:
      type: object
      description: >-
        The teacher roster scales with institution headcount — paginated like
        EventCollection, unlike CategoryCollection/BranchCollection.
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TeacherProfile"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    CreateTeacherProfileRequest:
      type: object
      required: [email, branch_ids, category_ids]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
          description: >-
            Email of an existing, already-provisioned users row. Resolved
            server-side; the request does not pre-provision an identity.
        branch_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        category_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid

    StudentRosterImportResult:
      type: object
      required: [import_id, total_rows, inserted_rows, updated_rows, unchanged_rows, invalid_rows, database_count, errors]
      properties:
        import_id:
          type: string
          format: uuid
        total_rows:
          type: integer
          minimum: 0
        inserted_rows:
          type: integer
          minimum: 0
        updated_rows:
          type: integer
          minimum: 0
        unchanged_rows:
          type: integer
          minimum: 0
        invalid_rows:
          type: integer
          minimum: 0
        database_count:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: "#/components/schemas/StudentRosterImportError"

    StudentRosterImportError:
      type: object
      required: [row, field, code, message]
      properties:
        row:
          type: integer
          minimum: 1
        field:
          type: string
        code:
          type: string
        message:
          type: string

    StudentCollection:
      type: object
      description: >-
        The card-populator roster read. Paginated like EventCollection, and
        deliberately bounded to display fields only — no email or card-token
        material.
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedCardStudent"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    ResolvedCardStudent:
      type: object
      required: [student_id, roll_no, display_name, branch, section, batch]
      properties:
        student_id:
          type: string
          format: uuid
        roll_no:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        branch:
          type: string
          minLength: 1
          maxLength: 32
        section:
          type: string
          minLength: 1
          maxLength: 32
        batch:
          type: string
          minLength: 1
          maxLength: 32

    CardSeal:
      type: object
      required: [student, version, token, payload]
      properties:
        student:
          $ref: "#/components/schemas/ResolvedCardStudent"
        version:
          type: string
          minLength: 1
          maxLength: 16
        token:
          type: string
          minLength: 43
          maxLength: 128
        payload:
          type: object
          required: [version, token]
          additionalProperties: false
          properties:
            version:
              type: string
              minLength: 1
              maxLength: 16
            token:
              type: string
              minLength: 43
              maxLength: 128

    CardTokenResolveRequest:
      type: object
      required: [version, token]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 16
        token:
          type: string
          minLength: 43
          maxLength: 128

    CaptureMethod:
      type: string
      # `dispute` is not a capture at all — it is how a record created by an
      # APPROVED missed-slot dispute is distinguished from one a teacher searched
      # for. Recording those as `search` would put a lie in the one table whose
      # job is to say who marked a student and how.
      enum: [nfc, camera, search, dispute]
      x-enum-varnames: [Nfc, Camera, Search, Dispute]

    StudentSearchResults:
      type: object
      description: >-
        The authenticated roster search read. Deliberately unpaginated — the
        server caps the result count instead — and bounded to display fields
        only: `students` has no email column and card tokens are stored as
        fingerprints, so neither can appear here.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedCardStudent"

    # ─── PUBLIC (UNAUTHENTICATED) SCHEMAS — Story 0.10 ──────────────────────
    #
    # Every schema below is serialised to callers with NO credential. Three
    # rules hold for all of them:
    #
    #  1. They are DISTINCT types. None $refs AttendanceRecord, AttendanceActor,
    #     ResolvedCardStudent or any other authenticated schema, even where the
    #     fields coincide today. Sharing one means the next field added for the
    #     admin surface — a credit balance, an email, a dispute note — ships to
    #     the open internet with nobody reviewing that decision.
    #  2. Adding a property here is a DISCLOSURE decision. A contract test holds
    #     each of these to an exact allowlist, so a new field fails the build
    #     until it is argued for in the same change.
    #  3. Every property is `required`. An optional key becomes `| undefined` in
    #     the generated client, which the UI silently renders as blank.

    PublicStudent:
      type: object
      description: >-
        A student as the public dashboard shows them: display fields only. The
        `students` table has no email column and card material lives in
        `student_card_tokens`, which no public query joins, so this shape cannot
        be widened by accident — only deliberately.
      required: [student_id, roll_no, display_name, branch, section, batch]
      properties:
        student_id:
          type: string
          format: uuid
        roll_no:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        branch:
          type: string
          minLength: 1
          maxLength: 32
        section:
          type: string
          minLength: 1
          maxLength: 32
        batch:
          type: string
          minLength: 1
          maxLength: 32

    PublicODRecord:
      type: object
      description: >-
        One present OD record as a student sees it. The marker is a NAME and a
        ROLE — that is the entire actor surface. `AttendanceActor` carries an
        email and a user id and must never be the shape this reuses.
      required:
        [record_id, slot, event_id, event_name, event_date, od_date, category_id,
         category_name, marked_by_name, marked_by_role, marked_at]
      properties:
        record_id:
          type: string
          format: uuid
        slot:
          type: integer
          minimum: 1
          maximum: 20
        event_id:
          type: string
          format: uuid
        event_name:
          type: string
          minLength: 1
        event_date:
          type: string
          format: date
          description: >-
            The EVENT's first day, kept alongside `od_date` because the dispute
            form builds its event options from it. Not the day this OD belongs
            to — that is `od_date`, and on a multi-day event they differ.
        od_date:
          type: string
          format: date
          description: >-
            The day this OD belongs to. Never the day the row was written: a
            teacher's next-morning correction files under the day it fixes.
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
          minLength: 1
        marked_by_name:
          # Nullable because od_records.actor_user_id is ON DELETE SET NULL: an
          # off-boarded teacher must leave the student's record readable with no
          # name, never delete it as a side effect.
          type: string
          nullable: true
        marked_by_role:
          type: string
          enum: [coordinator, teacher, admin]
        marked_at:
          type: string
          format: date-time
          description: The server receipt time of the mark (`server_received_at`).

    PublicODDay:
      type: object
      description: >-
        One day's records. The grouping key is `od_records.od_date` — the day the
        OD belongs to — and NOT the event's first day, which would collapse a
        thirty-day festival onto one heading, nor the mark's receipt time, which
        would file a next-morning correction under the wrong day.
      required: [od_date, records]
      properties:
        od_date:
          type: string
          format: date
          description: >-
            Renamed from `event_date`: the key must name the fact it holds, and
            on a multi-day event those are different days.
        records:
          type: array
          description: Present records for this day, ordered by slot ascending.
          items:
            $ref: "#/components/schemas/PublicODRecord"

    ExtendedSlotsSetting:
      type: object
      description: >-
        The evening-slots switch. `max_slot` is included so a client never has to
        hold its own copy of what "on" means — the ceiling is the server's to
        decide, and a screen that hardcoded 20 would silently disagree the day
        that changed.
      required: [enabled, max_slot, updated_at]
      properties:
        enabled:
          type: boolean
        max_slot:
          type: integer
          minimum: 1
          maximum: 20
          description: The highest slot currently accepted — 12 when off, 20 when on.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the switch has never been written.

    ExtendedSlotsUpdate:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    PublicDayMark:
      type: object
      description: >-
        One slot a student was marked in, on the day being shown. The board's
        whole payload per mark: which slot, and what it was for.
      required: [slot, category_id, category_name, event_name]
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 20
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        event_name:
          type: string

    PublicDayStudent:
      type: object
      description: >-
        One row of the public board. Roll number and display name and nothing
        else that identifies a person — no student id (the per-student view is
        reached by searching, which is rate limited on its own terms), no
        branch, section or batch, and no email.
      required: [roll_no, display_name, marks]
      properties:
        roll_no:
          type: string
        display_name:
          type: string
        marks:
          type: array
          description: The student's marks on this day, ordered by slot ascending.
          items:
            $ref: "#/components/schemas/PublicDayMark"

    PublicDayAttendance:
      type: object
      description: >-
        One campus day's public attendance board. Unpaginated for the same reason
        PublicODRecordCollection is — a page parameter cannot be reconciled with
        grouping by student without splitting a student across pages — so the
        server caps the row read and reports whether the cap bit.
      required: [od_date, students, categories, truncated, generated_at]
      properties:
        od_date:
          type: string
          format: date
          description: The day these rows belong to, echoed so the client never has to assume.
        students:
          type: array
          description: Marked students ordered by roll number. Empty means nobody is marked yet.
          items:
            $ref: "#/components/schemas/PublicDayStudent"
        categories:
          type: array
          description: >-
            Every category with a mark on this day, for the filter control. Built
            from the UNFILTERED day on purpose: a list derived from the filtered
            rows would shrink to the one option already chosen, and there would
            be no way back.
          items:
            $ref: "#/components/schemas/PublicEventCategory"
        truncated:
          type: boolean
          description: >-
            True when the server's row cap was reached and the board is showing
            only part of the day. The screen must say so — a silently short board
            reads as "these students were not marked".
        generated_at:
          type: string
          format: date-time

    PublicODRecordCollection:
      type: object
      description: >-
        A student's whole public attendance view. Deliberately unpaginated: the
        server caps the underlying row read instead, because a page parameter
        cannot be reconciled with day grouping without splitting a day across
        pages.
      required: [student, days, generated_at]
      properties:
        student:
          $ref: "#/components/schemas/PublicStudent"
        days:
          type: array
          description: Days carrying at least one record, most recent first. Empty means no marks.
          items:
            $ref: "#/components/schemas/PublicODDay"
        generated_at:
          type: string
          format: date-time
          description: >-
            Server time at which this view was computed. Rendered as an
            "as of HH:MM" stamp so a stale tab is not mistaken for live truth.

    PublicStudentSearchResults:
      type: object
      description: >-
        The unauthenticated roster search read. Unpaginated and capped
        server-side at 10 results; there is no caller-supplied `limit`.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicStudent"

    PublicEventCategory:
      type: object
      description: >-
        Minimal public category option for dispute submission. Carries no event
        metadata, branch, coordinator or attendance counts.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1

    PublicEvent:
      type: object
      description: >-
        Minimal public event option for dispute submission. Deliberately omits
        branches, archive state, coordinators, counts and credits; the public
        dispute form only needs the event id, name, days and categories.
      required: [event_id, name, event_date, end_date, categories]
      properties:
        event_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        event_date:
          type: string
          format: date
          description: First day of the event's range.
        end_date:
          type: string
          format: date
          description: >-
            Last day of the event's range. The dispute form enumerates
            `event_date … end_date` as its bounded day options, so without it a
            student could not report a missed slot on day 2 of a festival.
        categories:
          type: array
          items:
            $ref: "#/components/schemas/PublicEventCategory"

    PublicEventCollection:
      type: object
      description: >-
        Fixed-cap public event options. No page, total or limit appears because
        the open internet supplies no knobs for this read.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicEvent"

    PublicDisputeRequest:
      type: object
      description: >-
        Public missed-slot dispute submission. The request carries both the
        selected public student id and the submitted university email; the
        backend resolves the email local-part to a roster roll number and refuses
        any mismatch with the same non-disclosing identity envelope. This public
        input must never carry student display fields, user ids, card material,
        resolution notes or another dispute's content.
      required: [student_id, submitted_email, event_id, category_id, od_date, slot, claimed_coordinator_name, student_note]
      properties:
        student_id:
          type: string
          format: uuid
        submitted_email:
          type: string
          maxLength: 320
          description: Lowercased for storage after domain validation; never echoed on public responses.
        event_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        od_date:
          type: string
          format: date
          description: The day the disputed OD belongs to, not the row write time.
        slot:
          type: integer
          minimum: 1
          maximum: 20
        claimed_coordinator_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Required free text; no public coordinator roster is exposed.
        student_note:
          type: string
          minLength: 1
          maxLength: 1000

    PublicDisputeReceipt:
      type: object
      description: >-
        Public creation receipt. It proves server-side roster auto-population by
        returning the resolved public student display shape, but deliberately
        never echoes submitted_email, user ids, card material, dispute content or
        resolution fields.
      required: [dispute_id, reference, status, submitted_at, student]
      properties:
        dispute_id:
          type: string
          format: uuid
        reference:
          type: string
          minLength: 1
          maxLength: 16
        status:
          type: string
          enum: [open]
        submitted_at:
          type: string
          format: date-time
        student:
          $ref: "#/components/schemas/PublicStudent"

    Dispute:
      type: object
      description: >-
        Authenticated teacher/admin dispute row. This shape includes submitted
        email and resolution fields, so no public schema may reference it.
      required:
        - dispute_id
        - reference
        - student
        - submitted_email
        - event_id
        - event_name
        - event_date
        - category_id
        - category_name
        - od_date
        - slot
        - claimed_coordinator_name
        - student_note
        - status
        - outcome
        - submitted_at
        - resolution_note
        - resolved_by_user_id
        - resolved_at
      properties:
        dispute_id:
          type: string
          format: uuid
        reference:
          type: string
        student:
          $ref: "#/components/schemas/PublicStudent"
        submitted_email:
          type: string
          maxLength: 320
        event_id:
          type: string
          format: uuid
        event_name:
          type: string
        event_date:
          type: string
          format: date
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
        od_date:
          type: string
          format: date
        slot:
          type: integer
          minimum: 1
          maximum: 20
        claimed_coordinator_name:
          type: string
          nullable: true
          maxLength: 200
        student_note:
          type: string
          nullable: true
          maxLength: 1000
        status:
          type: string
          enum: [open, resolved]
        outcome:
          type: string
          # REQUIRED as well as nullable, for the same reason MarkStatus.slot is:
          # it is always present, and it is null exactly while the dispute is
          # open. Merely optional lets the generator emit `omitempty`, and a
          # client then cannot tell "still open" from "this server is too old to
          # report an outcome" — which is the difference between a slot that will
          # be credited and one that silently never was.
          nullable: true
          enum: [approved, rejected]
        od_record_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The attendance record an approved resolution created, returned only
            on the response to that resolution. Null when the outcome was
            rejected, when the student was already marked for the slot, and on
            every list read.
        submitted_at:
          type: string
          format: date-time
        resolution_note:
          type: string
          nullable: true
          maxLength: 2000
        resolved_by_user_id:
          type: string
          format: uuid
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true

    DisputeCollection:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Dispute"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    DisputeResolutionRequest:
      type: object
      required: [resolution_note, outcome]
      properties:
        resolution_note:
          type: string
          minLength: 1
          maxLength: 2000
        outcome:
          type: string
          # REQUIRED, with no default. An absent outcome is ambiguous in the one
          # direction that matters: defaulting to approved credits slots nobody
          # approved, defaulting to rejected silently drops the credit the
          # teacher meant to give.
          enum: [approved, rejected]

    SectionCardStatus:
      type: object
      description: >-
        One student's card state. Deliberately carries no token, fingerprint or
        seal version — the populator is reading PROGRESS, and card material it is
        not about to write has no business on the wire.
      required: [student_id, issued, verified_at]
      properties:
        student_id:
          type: string
          format: uuid
        issued:
          type: boolean
          description: A token row exists. NOT proof the card took the write.
        verified_at:
          type: string
          format: date-time
          # REQUIRED as well as nullable: always present, null when the card has
          # never been read back. Merely optional lets the generator omit the key,
          # and a client then cannot tell "not verified" from "this server does
          # not track verification" — the difference between a card that needs a
          # tap and one that does not.
          nullable: true

    SectionCardStatusCollection:
      type: object
      required: [data, total, issued, verified]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SectionCardStatus"
        total:
          type: integer
          minimum: 0
          description: Students in the section.
        issued:
          type: integer
          minimum: 0
        verified:
          type: integer
          minimum: 0

    MarkStatus:
      type: object
      description: >-
        Everything the marking screen needs that the client must not compute for
        itself. `slot: null` is the explicit "no slot is open" state — never
        slot 0 — and `server_time` shares one clock read with the slot decision.
      # `slot` is REQUIRED as well as nullable: it is always present, and it is
      # null when no slot is open. Leaving it merely optional lets the generator
      # emit `omitempty`, which omits the key entirely — and a client then cannot
      # tell "no slot is open" from "this server is too old to report slots".
      required: [server_time, slot, counters, fallback_credit]
      properties:
        server_time:
          type: string
          format: date-time
        slot:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MarkSlotWindow"
        counters:
          $ref: "#/components/schemas/MarkCounters"
        fallback_credit:
          $ref: "#/components/schemas/FallbackCreditState"

    FallbackCreditState:
      type: object
      description: >-
        Server-derived camera/search fallback-credit state for the selected
        event and caller. NFC never consumes this pool.
      required: [limit, consumed, remaining, exhausted]
      properties:
        limit:
          type: integer
          minimum: 0
        consumed:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        exhausted:
          type: boolean
        warning_threshold:
          type: integer
          minimum: 0

    MarkSlotWindow:
      type: object
      description: The bounds of the currently active slot, in server time.
      required: [slot, started_at, ends_at]
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 20
        started_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    MarkCounters:
      type: object
      description: >-
        Both figures are server-computed live counts over od_records (FR13),
        scoped to the CAMPUS-LOCAL DAY of the request. `mine` is the calling
        actor's marks for this event, category and day; `category_total` is
        every actor's for the same three, and is identical for all callers.

        The day scope is not cosmetic: on a multi-day event these are the
        figures a coordinator reads as "today", so a running total across the
        whole festival would make the screen useless by day three. They reset at
        campus midnight, and the marking screen labels them as today's.
      required: [mine, category_total]
      properties:
        mine:
          type: integer
          minimum: 0
        category_total:
          type: integer
          minimum: 0

    MarkAttendanceRequest:
      type: object
      description: >-
        Exactly one identity, paired with the capture method that produced it.
        `card` is valid for `nfc` and `camera`; `student_id` is valid for
        `camera` and `search`. The camera pairs with BOTH because the barcode
        printed on the physical university ID card carries a ROLL NUMBER, not a
        sealed token — the client resolves that roll to a student_id through
        `GET /api/v1/students/search` and marks with `capture_method: camera`.
        `capture_method` is persisted truthfully on the record and its audit row.
      required: [event_id, category_id, capture_method]
      oneOf:
        - type: object
          required: [student_id]
          properties:
            student_id:
              type: string
              format: uuid
          not:
            required: [card]
        - type: object
          required: [card]
          properties:
            card:
              $ref: "#/components/schemas/CardTokenResolveRequest"
          not:
            required: [student_id]
      properties:
        event_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        capture_method:
          type: string
          enum: [nfc, camera, search]
        student_id:
          type: string
          format: uuid
        card:
          $ref: "#/components/schemas/CardTokenResolveRequest"
        slot:
          type: integer
          minimum: 1.0
          maximum: 20.0
        od_date:
          type: string
          format: date
          description: >-
            Optional for teacher/admin manual search marks. When supplied, the
            record is filed under this campus day and the server/database require
            it to fall inside the event date range. Coordinator NFC/camera marks
            reject client dates and continue to use the server-derived campus
            day only.
        reason_note:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          description: Required for teacher/admin manual search marks; optional for coordinator capture.

    MarkAttendanceResult:
      type: object
      required:
        - record_id
        - student
        - event_id
        - category_id
        - slot
        - od_date
        - capture_method
        - server_received_at
      properties:
        record_id:
          type: string
          format: uuid
        student:
          $ref: "#/components/schemas/MarkedStudent"
        event_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        slot:
          type: integer
          minimum: 1.0
          maximum: 20.0
        od_date:
          type: string
          format: date
        reason_note:
          type: string
          nullable: true
          maxLength: 2000
        capture_method:
          $ref: "#/components/schemas/CaptureMethod"
        server_received_at:
          type: string
          format: date-time

    MarkedStudent:
      type: object
      required: [student_id, roll_no, display_name, branch, section, batch]
      properties:
        student_id:
          type: string
          format: uuid
        roll_no:
          type: string
        display_name:
          type: string
        branch:
          type: string
        section:
          type: string
        batch:
          type: string

    AttendanceActor:
      type: object
      description: >-
        Actor display snapshot for an OD record. All fields are required but
        nullable so records remain renderable after the referenced user row is
        removed through ON DELETE SET NULL.
      required: [user_id, email, name]
      properties:
        user_id:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        name:
          type: string
          nullable: true

    AttendanceRecord:
      type: object
      required:
        - record_id
        - student
        - event_id
        - category
        - slot
        - od_date
        - status
        - capture_method
        - marked_by
        - actor_role
        - server_received_at
      properties:
        record_id:
          type: string
          format: uuid
        student:
          $ref: "#/components/schemas/MarkedStudent"
        event_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/Category"
        slot:
          type: integer
          minimum: 1
          maximum: 20
        od_date:
          type: string
          format: date
          description: >-
            The day this OD belongs to. Without it a thirty-day event's list
            interleaves thirty days of the same slot with nothing on screen
            distinguishing them.
        status:
          type: string
          enum: [present, removed]
        reason_note:
          type: string
          nullable: true
          maxLength: 2000
        capture_method:
          $ref: "#/components/schemas/CaptureMethod"
        marked_by:
          $ref: "#/components/schemas/AttendanceActor"
        actor_role:
          type: string
          enum: [coordinator, teacher, admin]
        server_received_at:
          type: string
          format: date-time

    AttendanceRecordCollection:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceRecord"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    RecordCorrectionRequest:
      type: object
      required: [reason_note]
      properties:
        reason_note:
          type: string
          minLength: 1
          maxLength: 2000
        slot:
          type: integer
          minimum: 1
          maximum: 20
        category_id:
          type: string
          format: uuid
        od_date:
          type: string
          format: date

    RecordRemovalRequest:
      type: object
      required: [reason_note]
      properties:
        reason_note:
          type: string
          minLength: 1
          maxLength: 2000

    ODRecordMutationResult:
      type: object
      required: [record_id, event_id, category, slot, od_date, status, reason_note, actor_role, marked_by]
      properties:
        record_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        category:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
        slot:
          type: integer
          minimum: 1
          maximum: 20
        od_date:
          type: string
          format: date
        status:
          type: string
          enum: [present, removed]
        reason_note:
          type: string
          nullable: true
          maxLength: 2000
        actor_role:
          type: string
          enum: [coordinator, teacher, admin]
        marked_by:
          $ref: "#/components/schemas/AttendanceActor"

    ODRecordHistoryCollection:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceRecord"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    AuditLogEntry:
      type: object
      required: [action, actor_email, actor_role, occurred_at, payload]
      properties:
        id:
          type: string
          format: uuid
        target_table:
          type: string
          nullable: true
        target_id:
          type: string
          nullable: true
        action:
          type: string
        actor_email:
          type: string
          format: email
          nullable: true
        actor_role:
          type: string
          nullable: true
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          nullable: true
          additionalProperties: true

    AuditLogEntryCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"

    AuditLogPage:
      type: object
      required: [data, page, page_size, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    HealthStatus:
      type: object
      description: >-
        Health probe shape — overall service status plus database connectivity.
      required:
        - status
        - db
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
          description: >-
            Overall service status. "ok" when every dependency is reachable;
            "degraded" (served with HTTP 503) when the database is not.
        db:
          type: string
          enum:
            - up
            - down
          description: >-
            Database connectivity as observed by a live ping from the runtime
            pool. "down" is reported with HTTP 503.

    Error:
      type: object
      description: >-
        Standard error envelope for all non-2xx responses. Clients branch on
        `code`, never on `message`.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >-
            Canonical SCREAMING_SNAKE error code. This enum is the WIRE source of
            truth; the Go `errors.go` const registry mirrors it. Do not invent
            free-text codes.
          enum:
            - AUTH_DOMAIN_REJECTED
            - AUTH_TOKEN_INVALID
            - RBAC_FORBIDDEN
            - SCAN_DUPLICATE
            - SLOT_CLOSED
            - CARD_NOT_RECOGNIZED
            - CAPTURE_CREDIT_LIMIT_REACHED
            - QR_LIMIT_REACHED
            - RATE_LIMITED
            - INVALID_SCAN_ID
            - VALIDATION_FAILED
            - EVENT_NOT_FOUND
            - EVENT_ARCHIVED
            - CATEGORY_NOT_FOUND
            - OD_RECORD_NOT_FOUND
            - OD_RECORD_ALREADY_REMOVED
            - USER_NOT_FOUND
            - STUDENT_NOT_FOUND
            - ROLE_ALREADY_ASSIGNED
            - COORDINATOR_ASSIGNMENT_EXISTS
            - DISPUTE_IDENTITY_UNVERIFIED
            - DISPUTE_ALREADY_OPEN
            - DISPUTE_NOT_FOUND
            - DISPUTE_ALREADY_RESOLVED
            - INTERNAL
        message:
          type: string
          description: Human-readable message. For diagnostics/display only — branch on `code`.
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Optional, freeform context for generic errors. Typed validation
            failures use ValidationError.details (a typed array) instead.

    AuthenticatedIdentity:
      type: object
      description: >-
        Identity claims verified from the Supabase JWT and accepted by the
        backend amrita.edu domain-family gate.
      required:
        - email
        - subject
        - role
      properties:
        email:
          type: string
          description: Verified email claim from the Supabase session JWT.
        name:
          type: string
          description: >-
            Display name from Supabase user_metadata.name. Optional: some
            providers omit it, so the backend returns it only when present.
        subject:
          type: string
          description: Stable Supabase auth subject (`sub`) for the identity.
        role:
          $ref: "#/components/schemas/AuthenticatedIdentityRole"

    AuthenticatedIdentityRole:
      type: string
      description: >-
        The global base role the identity is provisioned with on first login.
        Always present (provisioning yields exactly one). This is the base role
        only — per-event coordinator assignment and RBAC enforcement are later
        epics; the client uses it to route by role.
      enum:
        - admin
        - teacher
        - coordinator
        - student

    RevokeSessionsRequest:
      type: object
      description: >-
        Forced-logout request. `scope` is required and explicit — the server
        never infers it. `session_id` is required (and a UUID) iff `scope` is
        `session`, and MUST be absent when `scope` is `all`.
      required:
        - scope
        - reason
      properties:
        scope:
          type: string
          description: >-
            `all` revokes every session for the user (a later re-login is a fresh
            session); `session` revokes exactly one session.
          enum:
            - all
            - session
        session_id:
          type: string
          format: uuid
          nullable: true
          description: The Supabase session id to revoke. Required iff `scope` is `session`.
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Human-readable reason for the forced logout (recorded in the audit log).

    SessionRevocationResult:
      type: object
      description: Result of recording a forced-logout revocation.
      required:
        - revocation_id
        - already_revoked
      properties:
        revocation_id:
          type: string
          description: Id of the deny-list revocation record.
        already_revoked:
          type: boolean
          description: >-
            True when this exact session was already revoked (an idempotent
            no-op; no new audit row was written).

    ValidationErrorDetail:
      type: object
      description: One typed, field-level validation failure.
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Offending request field path (e.g. `scans[0].method`).
        code:
          type: string
          description: Machine-readable field-level code (e.g. `required`, `invalid_format`).
        message:
          type: string
          description: Human-readable description of the field violation.

    ValidationError:
      type: object
      description: >-
        400 validation error — the error envelope whose `details` is a TYPED
        array of field-level failures (AC3), not a freeform object.
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          description: Always VALIDATION_FAILED for validation (400) responses.
          enum:
            - VALIDATION_FAILED
        message:
          type: string
          description: Human-readable summary of the validation failure.
        details:
          type: array
          description: Typed, per-field validation failures (AC3).
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"

    ScanItem:
      type: object
      description: >-
        A single client-captured scan. Wire field names are snake_case and
        LOCKED end-to-end (no camelCase anywhere on the wire).
      required:
        - id
        - event_id
        - slot
        - method
        - client_scanned_at
        - card_token
      properties:
        id:
          type: string
          description: >-
            Client-generated UUIDv7 — the SOLE idempotency key and primary key
            for this scan. The server rejects any non-UUID or non-v7 value with
            INVALID_SCAN_ID. The embedded UUIDv7 timestamp MUST NEVER be used for
            ordering or conflict resolution; server-authoritative time governs.
        event_id:
          type: string
          description: UUID of the event this scan belongs to.
        slot:
          type: integer
          description: The event slot (time window) in which the scan was captured.
        method:
          type: string
          description: Capture method used for this scan.
          enum:
            - barcode
            - qr
            - nfc
        client_scanned_at:
          type: string
          format: date-time
          description: >-
            RFC3339 UTC timestamp captured on the client at scan time. Advisory
            only — server-authoritative time governs resolution.
        card_token:
          type: string
          description: >-
            Raw scanned card/roll payload (NFC card UID, or the barcode/QR code
            value).

    ScanBatchRequest:
      type: object
      description: >-
        Batch scan-sync request. The batch is wrapped under a `scans` array
        (not a bare top-level array) to leave room for future top-level fields
        such as `device_id`.
      required:
        - scans
      properties:
        scans:
          type: array
          description: The batch of scans to accept-and-enqueue.
          items:
            $ref: "#/components/schemas/ScanItem"

    ScanResult:
      type: object
      description: Per-item result for one submitted scan, correlated by `id`.
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: The UUIDv7 `id` echoed from the corresponding request ScanItem.
        status:
          type: string
          description: >-
            Per-item outcome. `applied` = newly accepted/enqueued;
            `duplicate` = idempotency key already seen (safe no-op);
            `rejected` = not accepted (see `reason`).
          enum:
            - applied
            - duplicate
            - rejected
        reason:
          type: string
          nullable: true
          description: >-
            Present when `status` is `rejected`. Distinguishes PERMANENT
            rejections (quarantine — client must NOT retry) from TRANSIENT
            rejections (client may retry) so the client never sync-loops.

    ScanBatchResponse:
      type: object
      description: >-
        202 accept-and-enqueue response. 202 means ACCEPTED, not
        commit-confirmed — safe-to-evict is a later lifecycle signal.
      required:
        - results
      properties:
        results:
          type: array
          description: One result per submitted scan, correlated by `id`.
          items:
            $ref: "#/components/schemas/ScanResult"
