# sqlc configuration. sqlc reads the named queries in db/queries and the schema
# in db/migrations, and generates typed Go into internal/store/sqlc (DO NOT EDIT
# that output by hand).
version: "2"
sql:
  - engine: postgresql
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
