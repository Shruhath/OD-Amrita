              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/students/search:
    get:
      operationId: searchStudents
      summary: Search the roster by roll number or name
      description: >-
        The live marker's fallback when a card will not tap, and the resolution
        step for the camera path (the printed barcode carries a ROLL NUMBER).
        `q` is split on whitespace and EVERY word must appear somewhere in the
        roll number or name, so a surname finds a full name and word order does
        not matter; terms are ANDed, so a longer query can only ever return
        fewer rows. Ordering is exact roll first, then word-start matches, so
        typing a first name still puts that person at the top. Each word is
        LIKE-escaped, `q` is bounded at both ends so an empty query cannot
        become a roster dump, and the result item carries no email, card token
        or token fingerprint.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Words to match against the roll number and name, trimmed before length is judged.
          schema:
            type: string
            minLength: 3
            maxLength: 64
        - name: limit
          in: query
          description: Server-bounded result cap.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching students, exact roll match first. An empty list is a valid answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSearchResults"
        "400":
          description: Query below the minimum length or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller holds no role that may search the roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/me:
    get:
      operationId: getAuthenticatedIdentity
      summary: Return the authenticated user's verified identity
      description: >-
        Validates the Supabase bearer JWT, re-enforces the amrita.edu domain
        family server-side, and returns the identity claims loaded by auth
        middleware. This endpoint proves the authenticated round trip and is the
        future home of first-login user/role provisioning.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verified Amrita identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedIdentity"
        "401":
          description: Missing, malformed, expired, or otherwise invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated identity is outside the amrita.edu domain family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/users/{user_id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: Force-logout a user by revoking their Supabase-backed sessions
      description: >-
        Admin-only forced logout. Records a server-side session revocation for
        the target user in the local deny-list the auth middleware enforces on
        the NEXT request (not only at token expiry), and makes a best-effort
        Supabase-side revocation where a supported server-side API exists.
        Supabase remains the session authority; this endpoint never mints or
        stores tokens. The revocation is audit-logged.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: Application user id (users.id) of the account to force-log-out.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionsRequest"
      responses:
        "200":
          description: >-
            Revocation recorded. Idempotent for a repeated session revoke
            (already_revoked=true, no new audit row).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResult"
        "400":
          description: >-
            Request validation failed. The shared error middleware renders every
            error as the {code, message} envelope, so a 400 carries
            code=VALIDATION_FAILED and a human-readable message (no typed
            details array on this endpoint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/settings/extended-slots:
    get:
      operationId: getExtendedSlotsSetting
      summary: Whether the evening slots (13-20) are currently admitted
      description: >-
        The teaching day is slots 1-12 and ends at 18:15, so after quarter past
        six no slot is open and nobody can be marked. This switch admits slots
        13-20 — evening windows of forty minutes each, ending at 23:35 — so the
        real marking flow can be rehearsed outside teaching hours.

        It is a RUNTIME switch, not a deploy: the database's CHECK constraint is
        permanently widened to 20 and this decides what the application accepts
        within that. It defaults to OFF, which is the behaviour production has
        always had.
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: The switch as it currently stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendedSlotsSetting"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an administrator (RBAC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setExtendedSlotsSetting
      summary: Turn the evening slots on or off
      description: >-
        PUT rather than POST: the switch is a single value with a name, and
        setting it twice to the same thing must be the same as setting it once.
        Administrator only — it changes what every coordinator's device will
        accept.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendedSlotsUpdate"
      responses:
        "200":
          description: The switch as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtendedSlotsSetting"
        "400":
          description: Body missing the `enabled` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an administrator (RBAC_FORBIDDEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

