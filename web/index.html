<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/amrita-seal.png" />
    <link rel="apple-touch-icon" href="/brand/amrita-seal.png" />
    <!-- viewport-fit=cover lets the shell paint into the notch and home-indicator
         areas; the safe-area insets in App.css keep content clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b50246" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads none of the manifest. These three are what give a home-screen
         install there a title bar rather than Safari's chrome, and the app's own
         name rather than the document title. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OD-Amrita" />
    <meta name="description" content="On-duty event administration for Amrita Vishwa Vidyapeetham." />
    <title>OD-Amrita</title>
    <!--
      Resolves the theme BEFORE first paint. React cannot do this: the bundle
      parses and mounts after the first frame, so a light default would flash
      white at every dark-mode user on every load.

      The storage key is duplicated from src/features/theme/theme.ts because an
      inline script cannot import. A unit test asserts the two agree.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('od-amrita-theme')
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              typeof window.matchMedia === 'function' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
