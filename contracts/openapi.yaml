          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}:
    get:
      operationId: getAdminEvent
      summary: Read one event by id
      description: >-
        The item read behind every per-event admin surface. Without it a client
        has to scan the paginated collection and filter locally, which silently
        stops working once the event count outgrows one page.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}/archive:
    post:
      operationId: archiveAdminEvent
      summary: Irreversibly archive an event
      description: >-
        Transitions an active event to archived. Repeating the command is an
        idempotent read: it returns the same resource and creates no audit row.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current archived representation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/audit-log:
    get:
      operationId: listAdminAuditLog
      summary: List the immutable audit ledger
      description: >-
        Admin-only ledger read for operational investigation. Results are newest
        first and include actor, target and payload fields so administrators can
        inspect security/admin/business state changes without direct database
        access. Filters are exact-match and applied before pagination.
      security: [{bearerAuth: []}]
      parameters:
        - name: action
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 120}
        - name: actor_account
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 320}
        - name: target_table
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 120}
        - name: target_id
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200": {description: Audit entries, content: {application/json: {schema: {$ref: "#/components/schemas/AuditLogPage"}}}}
        "400": {description: Invalid query, content: {application/json: {schema: {$ref: "#/components/schemas/ValidationError"}}}}
        "401": {description: Unauthenticated, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Admin access required, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "500": {description: Internal error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /api/v1/admin/events/{event_id}/categories:
    parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listAdminEventCategories
      summary: List the categories belonging to one event
      description: >-
        Categories are bounded per-event reference data, so the collection is
        unpaginated. Results are ordered by name ASC, id ASC. An archived event
        remains readable — only writing is closed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every category of the requested event, in server order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminEventCategory
      summary: Add one category to an event
      description: >-
        Adds a single category. Several categories are added by repeating the
        command. Names are compared case-insensitively after trimming and must be
        unique within the event; a repeat is rejected as a typed field error.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category persisted under the event with its audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: >-
            Request validation failed with typed field details, including a
            duplicate name within the same event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            The event is archived. An archived event is a closed aggregate and
            accepts no child writes (EVENT_ARCHIVED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/events/{event_id}/categories/{category_id}/visibility:
