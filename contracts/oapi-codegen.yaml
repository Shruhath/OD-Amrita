# oapi-codegen configuration for the OD-Amrita contract.
#
# Generates DO NOT EDIT Go models from openapi.yaml into generated/go/. This is
# TYPES-ONLY: the gin ServerInterface / RegisterHandlers package
# (api/internal/api/generated.go) is deferred until the first real gin handlers
# land and a types↔server split earns its complexity. Keeping all generated Go
# here keeps the contract-drift gate (path-filtered on contracts/**)
# self-contained.
#
# Invoked from contracts/ by the Makefile:
#   oapi-codegen -config oapi-codegen.yaml openapi.yaml
package: contracts
output: generated/go/types.gen.go
generate:
  models: true
output-options:
  # Deterministic output is mandatory — the drift-gate diffs generated bytes.
  skip-fmt: false
  skip-prune: false
compatibility:
  # Prefix EVERY enum constant with its type name (e.g.
  # AuthenticatedIdentityRoleStudent, ErrorCodeINTERNAL). Without this,
  # oapi-codegen emits bare names (Student, Up, Ok) and only prefixes on a
  # cross-enum collision — so adding a future enum whose value collides would
  # silently RENAME an existing constant and break references. Always-prefix
  # makes the names stable and unambiguous regardless of what enums are added.
  always-prefix-enum-values: true
