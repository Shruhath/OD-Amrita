# api/ backend CI — runs only when the backend, the contract, or an acceptance
# harness changes.
# build:       go build + gofmt + go vet (no DB).
# acceptance:  the root-level acceptance harnesses (test/skeleton, test/contract).
# integration: real Postgres 17 service — role bootstrap, goose migrations, the
#              runtime-role DDL-denial gates, the walking-skeleton round-trip
#              conservation gate, and the /health db-up/db-down phases.
#
# `test/**` is in the path filters ON PURPOSE: the acceptance harnesses are their
# own Go modules at the repo root, so a change to one of them touches no path
# under api/ and would otherwise never trigger this workflow — the harness could
# be broken and no job would notice.
name: api-ci

on:
  push:
    paths:
      - "api/**"
      - "contracts/**"
      - "test/**"
      - "go.work"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "contracts/**"
      - "test/**"
      - "go.work"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: go build + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt (no diffs)
        working-directory: api
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt"
            echo "$unformatted"
            exit 1
          fi
      - name: go build
        working-directory: api
        run: go build ./...
      - name: go vet
        working-directory: api
        run: go vet ./...
      - name: shellcheck (operator scripts)
        # pg_backup.sh is an operator-facing backup script: a quoting bug in it is a
        # silently corrupt backup, discovered during an incident. shellcheck ships on
        # ubuntu-latest. --severity=style is the strictest setting and the script is
        # clean at it, so any new finding is a regression.
        run: shellcheck --severity=style api/scripts/*.sh
      - name: go test (no DB — integration suite must skip cleanly)
        working-directory: api
        run: go test ./...
      - name: sqlc compile-check (committed internal/store/sqlc is up to date)
        # Regenerate with the pinned sqlc and fail if the tree drifts — the same
        # generate-and-diff idiom as the contract drift-gate. Keep the version in
        # sync with api/Makefile SQLC_VERSION. No DB needed: codegen reads the SQL.
        working-directory: api
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          git diff --exit-code -- internal/store/sqlc

  acceptance:
    name: acceptance harnesses (skeleton + contract)
    runs-on: ubuntu-latest
    # These two harnesses existed since Stories 1.1 and 1.2 and — until this job —
    # were executed by NO workflow, on any path filter. An acceptance test that
    # nothing runs cannot block a merge, so the "ATDD seam tests can block merges"
    # claim was false in practice. This job is what makes it true.
    #
    # They are separate Go modules at the repo root, so they need their own steps:
    # the api/ jobs all run with `working-directory: api` and never see them.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Acceptance — monorepo skeleton (test/skeleton)
        working-directory: test/skeleton
        run: go test ./... -v
      - name: Acceptance — contract, codegen & drift gate (test/contract)
        # NOT `GOWORK=off`: this harness shells out to `go build ./...` inside api/,
        # and api/ resolves contracts/generated/go through the workspace. GOWORK=off
        # would be inherited by that subprocess and break the very build the harness
        # is checking. It is in go.work for exactly this reason.
        working-directory: test/contract
        run: go test ./... -v

  integration:
    name: postgres migrations + role gates + round-trip gate + /health
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: od_amrita
          POSTGRES_USER: od_amrita
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U od_amrita -d od_amrita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUPERUSER_DSN: postgres://od_amrita:ci_only_password@localhost:5432/od_amrita?sslmode=disable
      # Role passwords match the dev-only defaults in api/db/init/00_roles.sql.
      DATABASE_URL_MIGRATOR: postgres://od_migrator:migrator_dev_only_change_me@localhost:5432/od_amrita?sslmode=disable
      DATABASE_URL_RUNTIME: postgres://od_runtime:runtime_dev_only_change_me@localhost:5432/od_amrita?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install goose (pinned — keep in sync with api/Makefile GOOSE_VERSION)
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.2
      - name: Bootstrap DB roles (superuser step, outside goose)
        run: |
          psql "$SUPERUSER_DSN" -v ON_ERROR_STOP=1 -f api/db/init/00_roles.sql
      - name: goose up
        working-directory: api
        run: |
          goose -dir db/migrations postgres "$DATABASE_URL_MIGRATOR" up
      - name: Integration tests — migrations, immutability, role gates, tx-helper co-commit, round-trip gate
        # test/db, test/store and test/roundtrip share ONE database; -p 1 serializes
        # the package binaries so the migration round-trip test (which resets the
        # schema) cannot run under the tx-helper/conservation tests.
        #
        # ./test/roundtrip/... is the walking-skeleton exit gate: it drives the REAL
        # chain (auth middleware → MeHandler → user.Service → store.WithAudit →
        # Postgres) with only the token verifier faked, and asserts the audit-row
        # conservation property — including that a FAILED audit insert rolls the
        # users write back and returns 500, never 200.
        working-directory: api
        run: |
          go test -tags integration -p 1 ./test/db/... ./test/store/... ./test/roundtrip/... -v
      - name: goose down + re-up (clean revert)
        working-directory: api
        run: |
          goose -dir db/migrations postgres "$DATABASE_URL_MIGRATOR" down
          goose -dir db/migrations postgres "$DATABASE_URL_MIGRATOR" up
      - name: Start api server (TLS, self-signed) for /health
        working-directory: api
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -keyout certs/server.key -out certs/server.crt
          go build -o /tmp/od-api ./cmd/api
          # Auth is not exercised by the /health smoke test, but APP_ENV=ci is a
          # non-development env so config's fail-fast gate requires the auth URLs.
          # Supply unreachable stubs; the verifier's JWKS fetch is boot-tolerant
          # (a fetch failure is logged, not fatal), so /health still comes up.
          APP_ENV=ci API_PORT=8443 TLS_ENABLED=true \
            TLS_CERT_FILE=certs/server.crt TLS_KEY_FILE=certs/server.key \
            AUTH_JWKS_URL=https://auth.invalid/auth/v1/.well-known/jwks.json \
            AUTH_ISSUER=https://auth.invalid/auth/v1 \
            nohup /tmp/od-api > /tmp/od-api.log 2>&1 &
          for i in $(seq 1 20); do
            curl -skf https://localhost:8443/health > /dev/null && exit 0
            sleep 1
          done
          echo "server did not become healthy"
          cat /tmp/od-api.log
          exit 1
      - name: /health — db-up phase (200 ok/up)
        working-directory: api
        run: |
          API_BASE_URL=https://localhost:8443 \
            go test -tags integration ./test/health/... -v
      - name: Stop Postgres (server keeps running)
        # Reference the service container by its GitHub-assigned id — robust
        # against image-filter mismatches / empty matches that would silently
        # skip the teardown the db-down gate depends on.
        run: |
          docker stop "${{ job.services.postgres.id }}"
      - name: /health — db-down phase (503 degraded/down)
        working-directory: api
        run: |
          # Let the pool observe the dropped DB before asserting: poll until
          # /health flips to 503 so the gate isn't racing the TCP teardown.
          for i in $(seq 1 15); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/health || true)"
            [ "$code" = "503" ] && break
            sleep 1
          done
          API_BASE_URL=https://localhost:8443 HEALTH_EXPECT_DB_DOWN=1 \
            go test -tags integration ./test/health/... -v
