  /api/v1/students/search:
    get:
      operationId: searchStudents
      summary: Prefix-search the roster by roll number or name
      description: >-
        The coordinator's fallback when a card will not tap, and the resolution
        step for the camera path (the printed barcode carries a ROLL NUMBER).
        Matching is PREFIX-ONLY so `students_roll_no_idx` and
        `students_name_lower_idx` stay usable, `q` is bounded at both ends so an
        empty query cannot become a roster dump, and the result item carries no
        email, card token or token fingerprint.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Roll-number or name prefix, trimmed before length is judged.
          schema:
            type: string
            minLength: 3
            maxLength: 64
        - name: limit
          in: query
          description: Server-bounded result cap.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching students, exact roll match first. An empty list is a valid answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSearchResults"
        "400":
          description: Query below the minimum length or otherwise invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller holds no role that may search the roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/me:
    get:
      operationId: getAuthenticatedIdentity
      summary: Return the authenticated user's verified identity
      description: >-
        Validates the Supabase bearer JWT, re-enforces the amrita.edu domain
        family server-side, and returns the identity claims loaded by auth
        middleware. This endpoint proves the authenticated round trip and is the
        future home of first-login user/role provisioning.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verified Amrita identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedIdentity"
        "401":
          description: Missing, malformed, expired, or otherwise invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Authenticated identity is outside the amrita.edu domain family.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/admin/users/{user_id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      summary: Force-logout a user by revoking their Supabase-backed sessions
      description: >-
        Admin-only forced logout. Records a server-side session revocation for
        the target user in the local deny-list the auth middleware enforces on
        the NEXT request (not only at token expiry), and makes a best-effort
        Supabase-side revocation where a supported server-side API exists.
        Supabase remains the session authority; this endpoint never mints or
        stores tokens. The revocation is audit-logged.
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          description: Application user id (users.id) of the account to force-log-out.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeSessionsRequest"
      responses:
        "200":
          description: >-
            Revocation recorded. Idempotent for a repeated session revoke
            (already_revoked=true, no new audit row).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRevocationResult"
        "400":
          description: >-
            Request validation failed. The shared error middleware renders every
            error as the {code, message} envelope, so a 400 carries
            code=VALIDATION_FAILED and a human-readable message (no typed
            details array on this endpoint).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

