# web/ CI + deploy — runs only when the web app or the contract changes.
# Test + build validation for the web portal. The actual deploy step (static
# host) is wired once the surface has real content.
name: web-deploy

on:
  push:
    # Branches only. A tag push points at a commit these jobs have ALREADY passed
    # on its branch and again on main, so re-running the full matrix for the tag
    # buys nothing and was costing ~9 minutes of the private-repo Actions budget
    # per release. Restricting to branches excludes tag refs; drop this line once
    # the repo is public and minutes are unmetered.
    branches:
      - "**"
    paths:
      - "web/**"
      - "api/**"
      - "contracts/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"
  pull_request:
    paths:
      - "web/**"
      - "api/**"
      - "contracts/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-deploy.yml"

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck web
        run: pnpm --filter od-amrita-web typecheck
      - name: Lint web
        run: pnpm --filter od-amrita-web lint
      - name: Test web components
        run: pnpm --filter od-amrita-web test
      - name: Install Playwright Chromium
        run: pnpm --filter od-amrita-web exec playwright install --with-deps chromium
      - name: Test web journeys
        run: pnpm --filter od-amrita-web test:e2e
      - name: Build web
        run: pnpm --filter od-amrita-web build
      # - name: Deploy   # wired once the SPA has real content
      #   run: echo "deploy step lands with the first web release"

  portal-integration:
    name: browser + real API + postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: od_amrita
          POSTGRES_USER: od_amrita
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U od_amrita -d od_amrita"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SUPERUSER_DSN: postgres://od_amrita:ci_only_password@localhost:5432/od_amrita?sslmode=disable
      DATABASE_URL_MIGRATOR: postgres://od_migrator:migrator_dev_only_change_me@localhost:5432/od_amrita?sslmode=disable
      DATABASE_URL_RUNTIME: postgres://od_runtime:runtime_dev_only_change_me@localhost:5432/od_amrita?sslmode=disable
      CARD_SEAL_ACTIVE_VERSION: dev
      CARD_SEAL_HMAC_KEYS: dev=Y2ktZGV2LWNhcmQtc2VhbC1rZXktMzItYnl0ZXMhISEh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install database migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.2
      - name: Bootstrap and migrate database
        run: |
          psql "$SUPERUSER_DSN" -v ON_ERROR_STOP=1 -f api/db/init/00_roles.sql
          goose -dir api/db/migrations postgres "$DATABASE_URL_MIGRATOR" up
      - name: Start deterministic portal API
        working-directory: api
        run: |
          go build -o /tmp/od-portal-api ./test/portal
          nohup /tmp/od-portal-api > /tmp/od-portal-api.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8081/health > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/od-portal-api.log
          exit 1
      - name: API roster import journey
        run: pnpm --filter od-amrita-web test:api
      - name: Install Playwright Chromium
        run: pnpm --filter od-amrita-web exec playwright install --with-deps chromium
      - name: Browser persistence and authorization journey
        run: pnpm --filter od-amrita-web test:e2e:integration
      - name: Verify event audit conservation
        # Scoped to ONE event id, matched by prefix: the journey suffixes its
        # fixture name per run so repeated runs cannot leave two identically
        # named events behind, and a count across every match would then read as
        # a conservation failure caused by the feature rather than the fixture.
        run: |
          event_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id FROM events
            WHERE name LIKE 'Browser Persisted Event%'
            ORDER BY created_at DESC, id DESC
            LIMIT 1")"
          if [ -z "$event_id" ]; then
            echo "the browser journey did not create its fixture event"
            exit 1
          fi
          count="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log AS audit
            WHERE audit.target_id = '$event_id'
              AND audit.action IN ('event.created', 'event.archived')")"
          [ "$count" = "2" ] || {
            echo "expected exactly two event audit rows for event $event_id, got $count"
            exit 1
          }
      - name: Verify category audit conservation
        # Separate from the assertion above rather than loosening it: a
        # category.created row targets the categories table and can never match
        # a join against events.id.
        #
        # The journey adds exactly two categories and then attempts a duplicate,
        # which must contribute NOTHING. Asserting categories == audit rows == 2
        # is the conservation property end to end, through the browser.
        #
        # Scoped to ONE event id rather than to every event sharing the fixture
        # name. events.name carries no unique constraint and the journey creates
        # its event through the UI, so a Playwright retry or a second local run
        # leaves two identically-named events behind — and a name-filtered count
        # then reports 4 and fails as an "audit conservation" error, pointing at
        # the feature instead of at the duplicate fixture.
        run: |
          event_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id FROM events
            WHERE name LIKE 'Browser Category Event%'
            ORDER BY created_at DESC, id DESC
            LIMIT 1")"
          if [ -z "$event_id" ]; then
            echo "the browser journey did not create its fixture event"
            exit 1
          fi
          categories="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*) FROM categories WHERE event_id = '$event_id'")"
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log AS audit
            JOIN categories AS category ON audit.target_id = category.id::text
            WHERE category.event_id = '$event_id'
              AND audit.action = 'category.created'
              AND audit.target_table = 'categories'")"
          [ "$categories" = "2" ] && [ "$audits" = "2" ] || {
            echo "expected two categories and two category.created rows for event $event_id, got $categories and $audits"
            exit 1
          }
      - name: Verify teacher audit conservation
        # The fixture is a STABLE, non-suffixed email (unlike the events/
        # categories fixtures above): D2 makes a repeat elevation a 409 that
        # writes nothing, so a long-lived harness must be able to re-run this
        # journey indefinitely while the audit row count for that one user
        # stays at exactly 1 forever — never accumulating across CI runs and
        # never zero once the first run has landed it.
        run: |
          user_id="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT id FROM users
            WHERE lower(email) = 'teacher-fixture-student@amrita.edu' AND role = 'teacher'")"
          if [ -z "$user_id" ]; then
            echo "the browser journey did not elevate its fixture user"
            exit 1
          fi
          count="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM audit_log AS audit
            WHERE audit.target_id = '$user_id'
              AND audit.action = 'teacher.profile_created'
              AND audit.target_table = 'users'")"
          [ "$count" = "1" ] || {
            echo "expected exactly one teacher.profile_created audit row for user $user_id, got $count"
            exit 1
          }
      - name: Verify student import audit conservation
        run: |
          imports="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM student_roster_imports
            WHERE source_filename IN ('students.csv', 'mixed-students.csv')")"
          audits="$(psql "$DATABASE_URL_MIGRATOR" -Atc "
            SELECT count(*)
            FROM student_roster_imports AS roster_import
            JOIN audit_log AS audit ON audit.target_id = roster_import.id::text
            WHERE roster_import.source_filename IN ('students.csv', 'mixed-students.csv')
              AND audit.action = 'student_roster.imported'
              AND audit.target_table = 'student_roster_imports'")"
          [ "$imports" = "3" ] && [ "$audits" = "3" ] || {
            echo "expected three student imports and three student_roster.imported rows, got $imports and $audits"
            exit 1
          }
