# Contract drift-gate — the SINGLE SOURCE OF TRUTH enforcer.
# Regenerates the Go + TS types from contracts/openapi.yaml with the REAL,
# PINNED generators (oapi-codegen + openapi-typescript) and fails if the
# checked-in generated output drifts from the spec (stale or hand-edited).
name: contract-drift

permissions:
  contents: read

on:
  push:
    # Branches only. A tag push points at a commit these jobs have ALREADY passed
    # on its branch and again on main, so re-running the full matrix for the tag
    # buys nothing and was costing ~9 minutes of the private-repo Actions budget
    # per release. Restricting to branches excludes tag refs; drop this line once
    # the repo is public and minutes are unmetered.
    branches:
      - "**"
    paths:
      - "contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/contract-drift.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/contract-drift.yml"

concurrency:
  group: contract-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: generate && git diff --exit-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Go toolchain — for `go run oapi-codegen@<pinned>` (Go model generation).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # Node + pnpm toolchain — for the root-installed, lock-pinned
      # openapi-typescript binary (TS type generation).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace (pins openapi-typescript)
        run: pnpm install --frozen-lockfile

      - name: Regenerate contract types (real codegen)
        run: make -C contracts generate

      - name: Fail on generated drift
        # Use `git status --porcelain` (not `git diff --exit-code`) so the gate
        # also catches NEW untracked generated files — a plain `git diff` only
        # compares tracked files and would pass green when generate emits a
        # brand-new, uncommitted output file.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output drifted from the spec (modified or new untracked file). Run 'make -C contracts generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi
