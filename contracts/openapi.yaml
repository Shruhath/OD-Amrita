        "500": {description: Internal error, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /api/v1/admin/events/{event_id}/attendance:
    get:
      operationId: listAdminEventAttendance
      summary: List attendance records for one event
      description: >-
        Admin-only event verification read. Filters are applied server-side
        before pagination, returns present and removed OD rows, and exposes
        display, actor, status, and record-reason fields needed to verify the
        event without revealing card tokens, fingerprints, fallback-credit
        internals, dispute records or resolution notes, or private student email.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: slot
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: od_date
          in: query
          description: >-
            Narrow the list to one day of a multi-day event. Optional: the
            unfiltered read across the whole range stays the default.
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          # 1000, not 100, BECAUSE OF THE EXPORT. The per-slot workbook download
          # reads a whole day through this endpoint and pages until it has
          # everything. At 100 a day of 20,000 records was 200 sequential
          # requests, and every one of them dragged a full re-count of the
          # filtered set alongside the page - roughly 800 queries for one
          # download. The screens still ask for 20 or 50; this raises only the
          # ceiling a deliberate bulk reader may choose.
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
      responses:
        "200":
          description: Page of attendance rows for the requested event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecordCollection"
        "400":
          description: Invalid filter or pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Administrator access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/portal/mark/events/{event_id}/attendance:
    get:
      operationId: listPortalMarkEventAttendance
      summary: List attendance records the caller may review
      description: >-
        The teacher/admin live view of an event's marks, returning present and
        removed OD rows. A SIBLING of `/api/v1/admin/events/{event_id}/attendance`,
        never a replacement: this one is BRANCH-SCOPED for a teacher, returning
        only records for students in the branches they teach, which is the same
        rule that decides which students they may mark. A teacher who cannot
        mark a student has no reason to read that student's record either. An
        admin is unscoped here and sees exactly what the admin route returns.
      security:
        - bearerAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: slot
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - name: od_date
          in: query
          description: >-
            Narrow the list to one day. The live view sends today by default,
            which is the question this screen exists to answer.
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          # 1000, not 100, BECAUSE OF THE EXPORT. The per-slot workbook download
          # reads a whole day through this endpoint and pages until it has
          # everything. At 100 a day of 20,000 records was 200 sequential
          # requests, and every one of them dragged a full re-count of the
          # filtered set alongside the page - roughly 800 queries for one
          # download. The screens still ask for 20 or 50; this raises only the
          # ceiling a deliberate bulk reader may choose.
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
      responses:
        "200":
          description: Page of attendance rows the caller may review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecordCollection"
        "400":
          description: Invalid filter or pagination value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Teacher or administrator access is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/events:
    get:
      operationId: listMarkableEvents
      summary: List the active events the caller may mark for
      description: >-
        The live marking surface's scoped event read. A sibling of
        `/api/v1/admin/events`, never a replacement: this one is authenticated
        and returns ACTIVE events only. Coordinators see assigned events; admins
        see active events. The marking selector can never offer an event the
