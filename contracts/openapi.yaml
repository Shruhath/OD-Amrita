          format: uuid
    get:
      operationId: listAdminEventCategories
      summary: List the categories belonging to one event
      description: >-
        Categories are bounded per-event reference data, so the collection is
        unpaginated. Results are ordered by name ASC, id ASC. An archived event
        remains readable — only writing is closed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every category of the requested event, in server order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
        "400":
          description: The event id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAdminEventCategory
      summary: Add one category to an event
      description: >-
        Adds a single category. Several categories are added by repeating the
        command. Names are compared case-insensitively after trimming and must be
        unique within the event; a repeat is rejected as a typed field error.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category persisted under the event with its audit row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: >-
            Request validation failed with typed field details, including a
            duplicate name within the same event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Missing, malformed, expired, or revoked token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Caller is not a provisioned Admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No event exists with the supplied id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
