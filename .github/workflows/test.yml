name: Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly burn-in on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.5"

jobs:
  # Lint stage - Code quality checks (frontend + backend)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Frontend lint
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend linter (warnings OK)
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      # Backend lint (Go)
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go fmt check
        run: |
          echo "Checking Go formatting..."
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ Go code is not formatted. Files:"
            echo "$UNFORMATTED"
            echo ""
            echo "Differences:"
            gofmt -s -d .
            exit 1
          else
            echo "✅ Go formatting OK"
          fi

      - name: Run Go vet
        run: |
          echo "Running Go vet analysis..."
          go vet ./... && echo "✅ Go vet OK" || (echo "❌ Go vet failed" && exit 1)

  # Backend test stage - Go tests with parallel sharding
  test-backend:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go tests with coverage
        run: |
          go test -v -coverprofile=coverage-shard-${{ matrix.shard }}.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}.out
          retention-days: 30

  # Frontend test stage placeholder - Expo React Native
  test-frontend:
    name: Frontend Tests (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Expo configuration
        working-directory: frontend
        run: npx expo --version

      # Placeholder: Frontend testing framework setup needed
      # Consider adding:
      # - Jest + React Native Testing Library
      # - Detox for E2E testing
      # - native test runner from Expo
      - name: Frontend tests - Setup required
        working-directory: frontend
        run: |
          echo "ℹ️  Frontend testing framework is not yet configured."
          echo "Consider adding Jest + React Native Testing Library for unit/integration tests."
          echo "See: https://docs.expo.dev/testing/overview/"

  # Burn-in stage - Flaky test detection (backend Go)
  burn-in:
    name: Burn-In (Flaky Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test-backend]
    # Only run burn-in on PRs to main/develop or on schedule
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run burn-in loop - Go tests (10 iterations)
        run: |
          echo "🔥 Starting burn-in loop - detecting flaky tests"
          for i in {1..10}; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔥 Burn-in iteration $i/10"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            go test -v ./... || exit 1
          done
          echo "✅ Burn-in complete - no flaky tests detected"

  # Report stage - Aggregate and publish results
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, burn-in]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute coverage
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Tests**: ${{ needs.test-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Tests**: ${{ needs.test-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Burn-in**: ${{ needs.burn-in.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- Go test shards: 2" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage artifacts: [Available](artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.burn-in.result }}" == "failure" ]; then
            echo "⚠️ **Flaky tests detected** - Review burn-in output" >> $GITHUB_STEP_SUMMARY
          fi
