# Local dev stack for the OD-Amrita backend (skeleton). Postgres + the two api/
# entrypoints (server + persistent River worker).
# Build context is the repo root so the Dockerfile can see go.work + contracts/.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: od_amrita
      POSTGRES_USER: od_amrita
      POSTGRES_PASSWORD: dev_only_change_me
    # Loopback only: the passwords in this file and in db/init are public
    # development placeholders, so the database must not be reachable from
    # other machines on the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Superuser role bootstrap (od_migrator / od_runtime) — runs once on a
      # fresh volume. In prod the same SQL is a documented operator step.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U od_amrita -d od_amrita"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        ENTRYPOINT_BIN: api
    # .env is developer-local (gitignored); copy .env.example → .env to override.
    # required: false so `docker compose up` works on a fresh clone without it.
    env_file:
      - path: .env
        required: false
    # In-network default for the runtime pool (host `db`); .env overrides via
    # compose interpolation. Dev-only password matches db/init/00_roles.sql.
    environment:
      DATABASE_URL_RUNTIME: ${DATABASE_URL_RUNTIME:-postgres://od_runtime:runtime_dev_only_change_me@db:5432/od_amrita?sslmode=disable}
    # TLS-only (NFR15): 8443, no :80 redirect listener.
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        ENTRYPOINT_BIN: worker
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
